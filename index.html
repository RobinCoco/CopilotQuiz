*{box-sizing:border-box;}
html, body{height:100% !important;width:100% !important;margin:0 !important;padding:0 !important;overflow:hidden !important;}
.quiz-root{
  font-family:'Poppins','Inter',system-ui,sans-serif;
  background:var(--bg-deep);
  color:var(--text-hi);
  border-radius:16px;
  padding:28px 28px 32px;
  max-width:760px;
  width:100%;
  position:fixed !important;
  inset:0 !important;
  margin:auto !important;
  z-index:0;
  overflow-y:auto;
  overflow-x:hidden;
  max-height:100vh !important;
  max-height:100dvh !important;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.quiz-root::-webkit-scrollbar{display:none;width:0;height:0;}
.quiz-root::before{
  content:'';
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:1;
  background:
    #F4F2E3;
}

.quiz-root > *{position:relative;}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;margin:0;}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--amber);
}
.mono{font-family:'JetBrains Mono',monospace;}
.hidden{display:none !important;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, input:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
::selection{background:var(--amber-dim);}

.home-title{
  font-family:'Bodoni Moda','Fraunces',serif;
  font-size:58px;
  font-weight:700;
  font-style:italic;
  letter-spacing:-0.01em;
  margin-top:8px;
  color:var(--text-hi);
}
.title-wrap{position:relative;display:table;margin:0 auto 22px;}
.byline{position:absolute;top:100%;right:2px;margin-top:-10px;transform:rotate(-3deg);transform-origin:right top;font-family:'Caveat',cursive;font-weight:600;font-size:24px;line-height:1;color:#111111;white-space:nowrap;}
@media(max-width:560px){ .byline{font-size:20px;} .title-wrap{margin-bottom:18px;} }
.home-sub{color:var(--text-mid);font-size:14px;line-height:1.6;max-width:520px;margin-top:8px;}

.gauge-row{display:flex;gap:14px;margin:26px 0 22px;flex-wrap:wrap;}
.gauge-cell{flex:1;min-width:110px;background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;}
.gauge-cell svg{display:block;margin:0 auto;}
.gauge-label{font-size:11px;color:var(--text-mid);margin-top:8px;line-height:1.3;}

.cat-dot{border-radius:50%;flex-shrink:0;display:inline-block;}

.expedition-map{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;
  gap:28px 22px;margin:22px 0 20px;padding:4px 6px;
}
.map-node{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:none;border:none;width:96px;position:relative;
  transition:transform .2s ease;
}
.map-node:hover, .map-node:focus-visible{transform:translateY(-5px);}
.map-node-step{
  position:absolute;top:-4px;right:14px;z-index:2;
  width:20px;height:20px;border-radius:50%;
  background:var(--node-color);color:#12241A;
  font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.4), 0 0 0 3px var(--bg-deep);
}
.map-node-ring{
  width:68px;height:68px;border-radius:50%;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,0.16), rgba(255,255,255,0) 45%),
    radial-gradient(circle at 65% 75%, color-mix(in srgb, var(--node-color) 35%, var(--bg-panel)), var(--bg-panel) 70%);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  box-shadow:
    0 0 0 2.5px var(--node-color),
    0 10px 20px -4px rgba(0,0,0,0.55),
    inset 0 2px 5px rgba(255,255,255,0.12),
    inset 0 -6px 10px rgba(0,0,0,0.25);
}
.map-node-icon{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4));}
.map-node-dot{width:18px;height:18px;border-radius:50%;}
.map-node-count{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-low);background:rgba(0,0,0,0.25);padding:2px 8px;border-radius:20px;}

.start-btn{
  width:100%;margin-top:18px;
  background:var(--amber);color:#3A1706;border:none;border-radius:12px;
  padding:16px;font-size:15px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;
  letter-spacing:0.01em;
}
.start-btn:hover{background:#F0854D;}
.start-btn:disabled{opacity:0.5;cursor:default;}

.gate-input{
  width:100%;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;
  padding:13px 14px;color:var(--text-hi);font-size:14px;font-family:'Inter',sans-serif;
}
.gate-input:focus{outline:none;border-color:var(--amber-dim);}
.gate-input::placeholder{color:var(--text-low);}
.gate-error{color:var(--bad);font-size:12.5px;margin-top:2px;}
.gate-note{font-size:11.5px;color:var(--text-low);line-height:1.55;margin-top:4px;}

.panel-frame{
  background:var(--bg-panel);border:1px solid var(--line);border-radius:30px 14px 30px 14px;
  padding:22px 22px 24px;position:relative;
  animation:panelIn .35s ease both;
}
.panel-frame::before{
  content:'';position:absolute;inset:0;border-radius:30px 14px 30px 14px;
  border:1px solid var(--line-soft);margin:5px;pointer-events:none;
}
@keyframes panelIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes shakeX{
  10%,90%{transform:translateX(-1px);}
  20%,80%{transform:translateX(2px);}
  30%,50%,70%{transform:translateX(-4px);}
  40%,60%{transform:translateX(4px);}
}
.opt-btn.wrong-shake{animation:shakeX .5s;}
@keyframes correctPulse{
  0%{box-shadow:0 0 0 0 rgba(74,222,128,0.5);}
  100%{box-shadow:0 0 0 14px rgba(74,222,128,0);}
}
.opt-btn.correct{animation:correctPulse .6s ease-out;}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.q-tag{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid currentColor;display:inline-flex;align-items:center;gap:6px;}
.q-points-live{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);}
.q-text{font-size:20px;line-height:1.45;font-weight:700;margin:6px 0 20px;color:var(--text-hi);}

.opt-list{display:flex;flex-direction:column;gap:9px;}
.q-progress{height:6px;border-radius:6px;background:var(--line-soft);overflow:hidden;margin:2px 0 8px;}
.q-progress > span{display:block;height:100%;background:linear-gradient(90deg, var(--good), var(--amber));border-radius:6px;transition:width .35s ease;}
.q-text:focus{outline:none;}
.q-text:focus-visible{outline:none;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
}
.opt-btn{
  display:flex;align-items:center;gap:12px;
  background:var(--bg-panel-2);border:1px solid var(--line);border-radius:18px 8px 18px 8px;
  padding:13px 14px;text-align:left;color:var(--text-hi);font-size:14px;line-height:1.4;
  transition:border-color .12s, transform .08s;
}
.opt-btn:active:not(:disabled){transform:scale(0.98);}
.opt-btn:hover:not(:disabled){border-color:var(--amber-dim);}

.click-zone{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:crosshair;line-height:0;}
.click-zone:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
.click-image{width:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;}
.click-hotspot-correct{position:absolute;border:3px solid var(--good);border-radius:8px;box-shadow:0 0 0 5px rgba(74,222,128,0.25);pointer-events:none;animation:correctPulse .6s ease-out;}
.click-mark-wrong{position:absolute;transform:translate(-50%,-50%);color:var(--bad);font-size:30px;font-weight:900;pointer-events:none;text-shadow:0 0 8px rgba(0,0,0,0.7);}
.opt-btn:disabled{cursor:default;}
.opt-key{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-low);
  border:1px solid var(--line);border-radius:5px;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.opt-btn.correct{border-color:var(--good);background:rgba(74,222,128,0.08);}
.opt-btn.correct .opt-key{border-color:var(--good);color:var(--good);}
.opt-btn.wrong{border-color:var(--bad);background:rgba(242,109,109,0.08);}
.opt-btn.wrong .opt-key{border-color:var(--bad);color:var(--bad);}

.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:13.5px;line-height:1.55;}
.feedback.ok{background:rgba(74,222,128,0.08);border:1px solid var(--good-dim);color:#CBF3DA;}
.feedback.ko{background:rgba(242,109,109,0.08);border:1px solid var(--bad-dim);color:#F6D2D2;}
.feedback-title{font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;}
.feedback-points{font-family:'JetBrains Mono',monospace;}

.next-btn{
  margin-top:18px;width:100%;background:transparent;color:var(--amber);
  border:1px solid var(--amber-dim);border-radius:10px;padding:13px;
  font-size:14px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;
}
.next-btn:hover{background:rgba(245,166,35,0.08);}

.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.back-link{font-size:12px;color:var(--text-low);border:none;background:none;font-family:'JetBrains Mono',monospace;}
.back-link:hover{color:var(--text-mid);}
.q-count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-mid);}

.cat-trail{display:flex;justify-content:space-between;gap:4px;margin:0 0 18px;}
.cat-trail-single{justify-content:flex-start;align-items:center;gap:12px;}
.trail-progress-text{font-size:12.5px;color:var(--text-mid);font-family:'JetBrains Mono',monospace;}
.trail-item{flex:1;display:flex;justify-content:center;}
.trail-ring{position:relative;width:38px;height:38px;}
.trail-ring svg{position:absolute;inset:0;}
.trail-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:17px;height:17px;object-fit:contain;}
.trail-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;}
.trail-active .trail-ring{animation:trailPulse 1.3s ease-in-out infinite;}
@keyframes trailPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(233,113,50,0));}50%{filter:drop-shadow(0 0 5px var(--amber));}}

.circ-timer{position:absolute;top:-18px;right:20px;width:56px;height:56px;}
.circ-timer svg{position:absolute;inset:0;}
.circ-timer-face{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;object-fit:cover;}
.circ-timer-num{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-mid);}
#timer-ring{transition:stroke-dashoffset .1s linear, stroke .3s;}

.results-hero{display:flex;flex-direction:column;align-items:center;padding:14px 0 22px;}
.badge-reveal{animation:badgePop .55s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes badgePop{0%{transform:scale(0.4) rotate(-12deg);opacity:0;}70%{transform:scale(1.08) rotate(3deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
.badge-name{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:16px;margin-top:10px;color:var(--text-hi);}
.badge-level{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-low);margin-top:2px;letter-spacing:0.05em;text-transform:uppercase;}
.results-score{font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:700;color:var(--amber);margin-top:10px;}
.results-caption{color:var(--text-mid);font-size:13.5px;margin-top:6px;text-align:center;max-width:420px;}
.results-sub{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-mid);margin-top:6px;}

.breakdown{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.bd-row{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.bd-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.bd-name{font-size:13.5px;font-weight:600;flex:1;}
.bd-bar-track{flex:2;height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;}
.bd-bar-fill{height:100%;border-radius:3px;}
.bd-score{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-mid);width:42px;text-align:right;}

.share-box{margin-top:22px;background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:18px;}
.share-title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14.5px;margin-bottom:12px;}
.share-card-preview{width:100%;border-radius:10px;display:block;margin-bottom:14px;background:var(--bg-panel-2);border:1px solid var(--line);min-height:80px;}
.share-actions{display:flex;flex-wrap:wrap;gap:8px;}
.share-btn{flex:1;min-width:140px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:12px 14px;font-size:13.5px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;}
.share-btn-native{background:var(--amber);color:#3A1706;}
.share-btn-linkedin{background:#0A66C2;}
.share-btn-linkedin:hover{background:#0955A3;}
.share-btn-twitter{background:#111417;}
.share-btn-twitter:hover{background:#000;}
.share-btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text-mid);}
.share-btn-ghost:hover{background:var(--bg-panel-2);}
.share-hint{font-size:11.5px;color:var(--text-low);margin-top:10px;line-height:1.5;}
.footer-links{display:flex;justify-content:center;gap:18px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line-soft);flex-wrap:wrap;}
.footer-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-mid);font-size:12.5px;font-weight:600;text-decoration:none;transition:color .15s;}
.footer-link:hover{color:var(--amber);}
.resume-box{margin:18px 0;background:var(--bg-panel);border:1px solid var(--amber-dim);border-radius:12px;padding:14px 16px;}
.resume-text{font-size:13.5px;color:var(--text-hi);margin-bottom:10px;}
.resume-actions{display:flex;gap:8px;}
.resume-actions .share-btn{padding:11px 14px;font-size:13px;}
.retry-row{display:flex;gap:10px;margin-top:20px;}
.retry-btn{flex:1;background:var(--amber);color:#3A1706;border:none;border-radius:10px;padding:14px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;}
.home-btn{flex:1;background:transparent;color:var(--text-mid);border:1px solid var(--line);border-radius:10px;padding:14px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;}

.lb-box{margin-top:22px;}
.lb-title{font-size:11px;font-weight:700;color:var(--text-mid);text-transform:uppercase;letter-spacing:.1em;font-family:'JetBrains Mono',monospace;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel);margin-bottom:8px;}
.lb-row.you{border-color:var(--amber);background:rgba(245,166,35,0.08);}
.lb-scroll{max-height:58vh;overflow-y:auto;padding-right:4px;margin-top:4px;}
.lb-search{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);font-size:13px;color:var(--text-hi);margin:2px 0 8px;font-family:inherit;}
.lb-search:focus{outline:none;border-color:var(--amber);}
.lb-loadmore{width:100%;margin-top:10px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel);color:var(--text-mid);font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;cursor:pointer;}
.lb-loadmore:hover{border-color:var(--amber);color:var(--text-hi);}
.lb-loadmore:disabled{opacity:.6;cursor:default;}
.lb-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-low);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.04em;}
.lb-pin{position:sticky;bottom:0;margin-top:8px;padding-top:8px;background:linear-gradient(180deg, rgba(244,242,227,0) 0%, var(--bg-deep) 40%);}
.lb-pin .lb-row{margin-bottom:0;box-shadow:0 -2px 14px rgba(16,58,46,0.10);}
.lb-rank{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-low);width:24px;flex-shrink:0;}
.lb-name{flex:1;font-size:13.5px;font-weight:600;}
.lb-score{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--amber);}
.lb-empty{color:var(--text-low);font-size:13px;padding:6px 0;}
.lb-tabs{display:flex;flex-wrap:nowrap;gap:6px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
.lb-tabs::-webkit-scrollbar{display:none;}
.lb-tab{flex-shrink:0;white-space:nowrap;background:var(--bg-panel);border:1px solid var(--line);color:var(--text-mid);border-radius:20px;padding:8px 14px;font-size:12.5px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;}
.lb-tab-active{background:var(--amber);color:#3A1706;border-color:var(--amber);}
.lb-refresh{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-low);border:none;background:none;}
.lb-refresh:hover{color:var(--text-mid);}

/* ===== Guide interactif Copilot (intégration) ===== */
.guide-cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:20px 0 4px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(135deg,var(--bg-panel),var(--bg-panel-2));color:var(--text-hi);transition:transform .15s ease,border-color .15s ease;}
.guide-cta:hover{transform:translateY(-2px);border-color:var(--amber);}
.guide-cta-ic{font-size:24px;width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--amber);}
.guide-cta-txt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
.guide-cta-txt strong{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;}
.guide-cta-txt small{color:var(--text-mid);font-size:12.5px;line-height:1.4;}
.guide-cta-arrow{color:var(--amber);font-size:20px;}
.guide-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:6px;flex-wrap:wrap;}
.guide-fs-btn{background:var(--bg-panel);border:1px solid var(--line);color:var(--text-hi);border-radius:10px;padding:8px 14px;font-size:13px;white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif;}
.guide-fs-btn:hover{border-color:var(--amber);}
.guide-frame-wrap{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 10px 34px rgba(0,0,0,.35);}
.guide-frame{width:100%;height:720px;border:0;display:block;background:#fff;}
.guide-frame:fullscreen{height:100vh;}
.q-text{overflow-wrap:anywhere;padding-right:64px;}
.q-meta{padding-right:64px;}
.opt-btn{align-items:flex-start;}
.opt-btn > span:last-child{min-width:0;overflow-wrap:anywhere;}
.top-bar{flex-wrap:wrap;gap:8px 12px;}
.circ-timer{z-index:3;}
@media(max-width:560px){
  .quiz-root{padding:20px 16px 24px;}
  .panel-frame{padding:18px 16px 20px;}
  .q-text{font-size:18px;padding-right:52px;}
  .q-meta{padding-right:52px;}
  .home-title{font-size:40px;}
  .circ-timer{right:12px;}
}
.fs-toggle{position:fixed;top:12px;right:12px;z-index:2147483000;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg-panel);color:var(--text-hi);font-size:15px;line-height:1;cursor:pointer;opacity:.82;box-shadow:0 2px 10px rgba(0,0,0,.35);}
.fs-toggle:hover{opacity:1;border-color:var(--amber);}
.lang-toggle{position:fixed;top:12px;right:56px;z-index:2147483000;display:flex;gap:2px;padding:3px;border-radius:9px;border:1px solid var(--line);background:var(--bg-panel);box-shadow:0 2px 10px rgba(0,0,0,.25);}
.lang-btn{border:none;background:transparent;cursor:pointer;font-size:15px;line-height:1;padding:4px 6px;border-radius:6px;opacity:.5;filter:grayscale(0.4);transition:all .15s;}
.lang-btn:hover{opacity:.85;}
.lang-btn.lang-active{opacity:1;filter:none;background:var(--amber-dim);}
@media(max-width:560px){ .lang-toggle{top:12px;right:52px;} }
.quiz-root:fullscreen{max-width:none;width:100vw;min-height:100vh;border-radius:0;overflow-y:auto;padding:6vh 20px;}
.quiz-root:-webkit-full-screen{max-width:none;width:100vw;min-height:100vh;border-radius:0;overflow-y:auto;padding:6vh 20px;}
.quiz-root:fullscreen > *{max-width:760px;margin-left:auto;margin-right:auto;}
.quiz-root:-webkit-full-screen > *{max-width:760px;margin-left:auto;margin-right:auto;}


/* ================= Refonte visuelle « flux » (couleurs pop perroquet) ================= */
.quiz-root{ background:#F4F2E3; }
/* fond mosaïque défini plus haut */
/* dégradé sombre uniquement sous l'en-tête (lisibilité), sans assombrir le reste */
.quiz-root::after{ content:''; position:absolute; inset:0 0 auto 0; height:0; }

/* Cartes claires (thème jungle) */
.panel-frame{
  background:rgba(255,255,255,0.92);
  -webkit-backdrop-filter:blur(10px) saturate(1.05); backdrop-filter:blur(10px) saturate(1.05);
  border:1px solid rgba(16,58,46,0.10);
  box-shadow:0 18px 50px rgba(16,58,46,0.14);
}
.opt-btn{ background:#ffffff; border:1px solid var(--line); }
.opt-btn:hover{ border-color:var(--amber); background:#FFF7F0; }
.gauge-cell{ background:#ffffff; border:1px solid var(--line); }
.top-bar{ text-shadow:none; }
.back-link{ color:var(--text-mid); }
.q-count{ color:var(--text-mid); }
.home-sub{ color:var(--text-mid); text-shadow:none; }
.home-title{ font-family:'Poppins',sans-serif !important; font-style:normal !important; font-weight:800 !important; letter-spacing:-0.02em; color:var(--text-hi) !important; text-shadow:none; }
.results-title, .score-big{ text-shadow:none; }
.hero-panel{
  background:rgba(255,255,255,0.94);
  -webkit-backdrop-filter:blur(10px) saturate(1.05); backdrop-filter:blur(10px) saturate(1.05);
  border:1px solid rgba(16,58,46,0.10);
  border-radius:26px;
  box-shadow:0 18px 50px rgba(16,58,46,0.16);
  padding:26px 24px 30px;
  max-width:700px; margin:0 auto;
}
.hero-panel .home-sub{ color:var(--text-mid) !important; text-shadow:none !important; }


.tagline{ font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; text-align:center; margin:4px 0 12px; letter-spacing:.005em; }

/* ===== Correctifs anti-débordement ===== */
/* Éviter tout dépassement horizontal global */
*{min-width:0;}
.quiz-root{overflow-x:clip;}
.quiz-root, .panel-frame, .hero-panel{max-width:100%;}
img, svg, .click-image{max-width:100%;}

/* Le timer circulaire vit dans une zone réservée : le contenu ne passe jamais dessous */
.panel-frame{padding-top:60px;}
/* Timer entièrement à l'intérieur de la carte (ne dépasse plus en haut) */
.circ-timer{top:14px;right:16px;}
.circ-timer-num{bottom:-14px;white-space:nowrap;}
.q-meta{padding-right:74px;margin-top:0;flex-wrap:wrap;gap:6px;}
.q-tag{max-width:100%;overflow-wrap:anywhere;}
.q-text{padding-right:70px;overflow-wrap:anywhere;word-break:break-word;hyphens:auto;}

/* Options : la puce ne rétrécit pas, le texte se replie proprement */
.opt-btn{align-items:flex-start;}
.opt-key{flex:0 0 20px;}
.opt-btn > span:last-child{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;line-height:1.45;}

/* Zone image cliquable : jamais plus large que le panneau */
.click-zone{max-width:100%;}

/* Feedback / explications : replier les mots longs (URLs, termes techniques) */
.feedback{overflow-wrap:anywhere;word-break:break-word;}
.feedback-title{flex-wrap:wrap;}

/* Barre du haut : items compacts, jamais de dépassement */
.top-bar{flex-wrap:wrap;gap:6px 10px;padding-right:44px;}
.q-count,.q-points-live,.back-link{white-space:nowrap;}
/* Le bouton plein écran est en position:fixed : on lui réserve la place
   pour qu'il ne recouvre plus le compteur "Q1/20" ni le titre. */
.quiz-root{padding-top:56px;}
@media(max-width:560px){ .quiz-root{padding-top:52px;} .top-bar{padding-right:40px;} }

/* Classement / partage : boutons et lignes qui se replient */
.share-actions{gap:8px;}
.share-btn{min-width:0;flex:1 1 140px;}
.lb-name{overflow-wrap:anywhere;min-width:0;}
.breakdown .bd-name{overflow-wrap:anywhere;min-width:0;}

/* Petits écrans : marge encore réduite + timer un peu plus petit */
@media(max-width:560px){
  .panel-frame{padding-top:54px;}
  .q-text{padding-right:56px;}
  .q-meta{padding-right:60px;}
  .circ-timer{width:48px;height:48px;right:12px;top:12px;}
  .circ-timer svg{width:48px;height:48px;}
  .circ-timer-face{width:30px;height:30px;}
}
@media(max-width:380px){
  .share-btn{flex-basis:100%;}
}

/* ===== Accueil : plus d'air + boutons d'accès repensés ===== */
.hero-panel{padding:40px 32px 40px;}
.hero-panel > *{margin-top:0;}
.home-sub{font-size:15px;line-height:1.7;margin-top:20px;max-width:560px;}

/* Nodes d'accès aux quiz : cartes rondes propres, bien espacées */
.expedition-map{gap:34px 26px;margin:34px 0 30px;}
.map-node{width:110px;gap:8px;}
.map-node-name{
  font-family:'Poppins',sans-serif;font-weight:700;font-size:12px;line-height:1.2;
  color:var(--text-hi);text-align:center;margin-top:2px;
}
.map-node-count{
  font-family:'Poppins',sans-serif;font-weight:600;font-size:10.5px;
  color:var(--text-low);background:transparent;padding:0;border-radius:0;
  letter-spacing:.01em;margin-top:-2px;
}
.map-node-locked{
  font-family:'Poppins',sans-serif;font-weight:600;font-size:9.5px;
  color:var(--good);margin-top:1px;
}
.map-node-ring{
  width:76px;height:76px;
  background:radial-gradient(circle at 32% 26%, #ffffff, color-mix(in srgb, var(--node-color) 12%, #ffffff) 78%);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--node-color) 55%, #ffffff),
             0 10px 22px -8px color-mix(in srgb, var(--node-color) 55%, transparent);
}
.map-node:hover .map-node-ring, .map-node:focus-visible .map-node-ring{
  box-shadow:0 0 0 3px var(--node-color),
             0 14px 26px -8px color-mix(in srgb, var(--node-color) 60%, transparent);
}
.map-node-icon{width:38px;height:38px;filter:none;}
.map-node-step{
  width:24px;height:24px;top:-6px;right:12px;font-size:12px;
  background:var(--node-color);color:#fff;
  box-shadow:0 2px 6px color-mix(in srgb, var(--node-color) 50%, transparent), 0 0 0 3px var(--bg-panel);
}

/* Onglets de filtre (Général / Basic / …) : pills soignés */
.lb-tabs{margin-top:8px;margin-bottom:22px;gap:8px;}
.lb-tab{
  border-radius:999px;padding:9px 16px;font-size:13px;
  border:1px solid var(--line);background:var(--bg-panel);
  color:var(--text-mid);transition:all .15s ease;
}
.lb-tab:hover{border-color:var(--node-color,var(--good));color:var(--text-hi);}
.lb-tab-active{
  background:var(--good);border-color:var(--good);color:#fff;
  box-shadow:0 4px 12px -4px color-mix(in srgb, var(--good) 55%, transparent);
}
.lb-box{margin-top:26px;}
#view-all-leaderboards{margin-top:14px !important;padding:14px;border-radius:12px;}
.footer-links{margin-top:30px;padding-top:22px;}

/* Badge général (progression cumulée sur les 5 thèmes) */
.general-badge{display:flex;align-items:center;gap:14px;justify-content:center;background:var(--bg-panel);border:1px solid rgba(16,58,46,0.10);border-radius:16px;padding:14px 18px;margin:18px auto 0;max-width:420px;box-shadow:0 10px 30px rgba(16,58,46,0.06);}
.general-badge-medal{flex:0 0 auto;line-height:0;}
.general-badge-info{text-align:left;min-width:0;}
.general-badge-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-low);}
.general-badge-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:var(--text-hi);line-height:1.2;}
.general-badge-meta{font-size:12px;color:var(--text-mid);margin-top:2px;}
/* Récapitulatif des erreurs en fin de quiz */
.review-box{background:var(--bg-panel);border:1px solid rgba(16,58,46,0.10);border-radius:16px;padding:18px 18px 6px;margin-top:22px;box-shadow:0 10px 30px rgba(16,58,46,0.06);}
.review-box.review-perfect{padding:16px 18px;color:var(--good);font-weight:600;text-align:center;}
.review-head{font-family:'Poppins',sans-serif;font-weight:700;color:var(--text-hi);font-size:15px;margin-bottom:12px;}
.review-item{border-left:3px solid var(--bad);background:var(--bad-dim);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.review-q{font-weight:600;color:var(--text-hi);font-size:14px;line-height:1.4;margin-bottom:6px;}
.review-answer{font-size:13px;color:#0F3B2E;margin-bottom:4px;}
.review-answer-label{font-weight:700;color:var(--good);}
.review-why{font-size:13px;color:var(--text-mid);line-height:1.5;}
/* Fond sobre pour les vues de jeu (pas d'illustration tropicale) */
.quiz-root.view-quiz::before, .quiz-root.view-results::before, .quiz-root.view-leaderboard::before{
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(27,127,106,0.10) 0%, rgba(27,127,106,0) 55%),
    #F4F2E3;
}

/* Feedback : texte lisible sur fond clair (les anciennes couleurs étaient prévues pour un thème sombre) */
.feedback.ok{background:var(--good-dim);border-color:color-mix(in srgb, var(--good) 30%, #fff);color:#0F3B2E;}
.feedback.ko{background:var(--bad-dim);border-color:color-mix(in srgb, var(--bad) 30%, #fff);color:#7A241E;}
.feedback.ok .feedback-title span:first-child{color:var(--good);}
.feedback.ko .feedback-title span:first-child{color:var(--bad);}
.feedback.ok .feedback-points{color:var(--good);}
.feedback.ko .feedback-points{color:var(--bad);}

/* ===== Accueil équilibré : sans aperçu de classement, plus aéré, tient sans défiler ===== */
.quiz-root{padding:20px 24px 22px;}
.hero-panel{padding:26px 26px 28px;}
.hero-panel > *{gap:6px;}
.title-wrap{margin:0 auto 14px;}
.byline{font-size:19px;margin-top:-8px;}
.home-sub{font-size:13.5px;line-height:1.5;margin-top:10px;}
.general-badge{padding:12px 16px;margin:12px auto 0;gap:12px;}
.general-badge-name{font-size:15px;}
.general-badge-meta{font-size:11.5px;}
.general-badge-label{font-size:10px;}
.expedition-map{gap:18px 18px;margin:16px 0 14px;}
.map-node{width:96px;gap:5px;}
.map-node-ring{width:62px;height:62px;}
.map-node-icon{width:30px;height:30px;}
.map-node-step{width:21px;height:21px;font-size:11px;top:-5px;right:10px;}
.map-node-name{font-size:11px;line-height:1.15;}
.map-node-count{font-size:9.5px;}
.map-node-locked{font-size:8.5px;}
#view-all-leaderboards{margin-top:6px !important;padding:13px;font-size:14px;}
.footer-links{margin-top:16px;padding-top:14px;gap:16px;}
@media(min-height:820px){
  .hero-panel{padding:32px 30px 32px;}
  .home-sub{font-size:14.5px;margin-top:12px;}
  .expedition-map{gap:24px 20px;margin:20px 0 18px;}
  .map-node{width:104px;}
  .map-node-ring{width:70px;height:70px;}
  .map-node-icon{width:34px;height:34px;}
}

const QUESTIONS_ALL = [
{cat:"basic", q:{fr:"Sur quelles sources Copilot Basic (Copilot Chat) s'appuie-t-il pour répondre ?", en:"Which sources does Copilot Basic (Copilot Chat) rely on to answer?"}, opts:{fr:["Le web et le contenu que vous lui fournissez dans la conversation","L'ensemble des emails, fichiers et réunions de l'organisation, accessibles en continu via Microsoft Graph","Une base de connaissances totalement figée, sans aucune connexion au web ni à vos documents","Les bases SQL internes de l'entreprise"], en:["The web and the content you provide it in the conversation","All of the organization's emails, files and meetings, accessed continuously via Microsoft Graph","A completely frozen knowledge base, with no connection to the web or your documents","The company's internal SQL databases"]}, correct:0, why:{fr:"Copilot Basic est ancré sur le web et sur ce que vous lui donnez ; l'accès aux données internes (emails, fichiers, Teams, SharePoint) via Microsoft Graph est réservé à l'offre payante.", en:"Copilot Basic is grounded on the web and on what you give it; access to internal data (emails, files, Teams, SharePoint) via Microsoft Graph is reserved for the paid offer."}},
{cat:"basic", q:{fr:"Que garantit la protection des données d'entreprise sur un compte professionnel Copilot Basic ?", en:"What does enterprise data protection guarantee on a Copilot Basic professional account?"}, opts:{fr:["Que Copilot peut lire tous les fichiers confidentiels de l'entreprise sans aucune restriction","Que vos échanges restent protégés et ne servent pas à entraîner les modèles","Que chaque réponse générée est automatiquement partagée avec l'ensemble de votre équipe","Que l'entreprise obtient un droit d'auteur exclusif sur chacune des réponses produites"], en:["That Copilot can read all of the company's confidential files without any restriction","That your exchanges stay protected and are not used to train the models","That every generated response is automatically shared with your whole team","That the company gains exclusive copyright over each response produced"]}, correct:1, why:{fr:"Avec un compte pro connecté, Copilot Chat applique la protection des données d'entreprise : vos échanges restent protégés et ne sont pas utilisés pour entraîner les modèles de fondation.", en:"With a connected pro account, Copilot Chat applies enterprise data protection: your exchanges stay protected and are not used to train the foundation models."}},
{cat:"basic", q:{fr:"Vous avez un rapport PDF et vous voulez de l'aide dessus. Que permet Copilot Basic ?", en:"You have a PDF report and want help with it. What does Copilot Basic allow?"}, opts:{fr:["Rien du tout : il ignore totalement les fichiers qu'on lui transmet dans le chat","Uniquement l'ouvrir et l'afficher, sans jamais pouvoir en analyser le contenu","Le téléverser dans le chat, puis le résumer ou l'interroger","Le publier automatiquement sur le web à la place de l'utilisateur"], en:["Nothing at all: it completely ignores the files you send it in the chat","Only opening and displaying it, without ever being able to analyze its content","Uploading it to the chat, then summarizing or querying it","Automatically publishing it on the web on the user's behalf"]}, correct:2, why:{fr:"Copilot Chat (Basic) prend en charge le téléversement d'un fichier : vous pouvez ensuite demander un résumé, une extraction d'informations ou poser des questions dessus.", en:"Copilot Chat (Basic) supports file upload: you can then ask for a summary, extract information, or ask questions about it."}},
{cat:"basic", q:{fr:"Concernant la génération d'images, que peut faire un utilisateur de Copilot Basic ?", en:"Regarding image generation, what can a Copilot Basic user do?"}, opts:{fr:["En générer, mais avec un nombre limité par jour","En générer sans absolument aucune limite quotidienne ou mensuelle","Aucune image n'est possible en Basic, quelle que soit la demande","Uniquement retoucher, jamais créer"], en:["Generate some, but with a limited number per day","Generate them with absolutely no daily or monthly limit","No image is possible in Basic, whatever the request","Only retouch, never create"]}, correct:0, why:{fr:"La génération d'images est disponible en Basic mais plafonnée (un quota quotidien, de l'ordre de 15 par jour) ; les offres payantes lèvent ces limites.", en:"Image generation is available in Basic but capped (a daily quota, on the order of 15 per day); paid offers lift these limits."}},
{cat:"basic", q:{fr:"Copilot Basic donne-t-il accès à des agents (assistants spécialisés) ?", en:"Does Copilot Basic give access to agents (specialized assistants)?"}, opts:{fr:["Non, la notion d'agent n'existe tout simplement pas dans Copilot Basic","Oui, dont certains facturés à l'usage","Non, les agents sont strictement réservés aux licences Copilot payantes","Oui, mais uniquement le seul agent Analyste, et rien d'autre"], en:["No, the notion of an agent simply does not exist in Copilot Basic","Yes, some of them billed per use","No, agents are strictly reserved for paid Copilot licenses","Yes, but only the single Analyst agent, and nothing else"]}, correct:1, why:{fr:"Copilot Chat (Basic) donne accès à des agents, dont certains facturés à la consommation (pay-as-you-go), sans licence Copilot par utilisateur.", en:"Copilot Chat (Basic) gives access to agents, some billed on consumption (pay-as-you-go), without a per-user Copilot license."}},
{cat:"basic", q:{fr:"Vous voulez le résumé automatique d'une réunion Teams enregistrée. Copilot Basic le fait-il ?", en:"You want the automatic summary of a recorded Teams meeting. Does Copilot Basic do it?"}, opts:{fr:["Oui, c'est une fonction standard entièrement incluse dans l'offre Basic","Oui, à condition que la réunion ait duré moins de quinze minutes","Non, cela requiert la licence payante Microsoft 365 Copilot","Oui, uniquement si la caméra était activée pendant toute la réunion"], en:["Yes, it is a standard feature fully included in the Basic offer","Yes, provided the meeting lasted less than fifteen minutes","No, this requires the paid Microsoft 365 Copilot license","Yes, only if the camera was on for the entire meeting"]}, correct:2, why:{fr:"Les résumés de réunions Teams s'appuient sur vos données de travail : ils requièrent la licence payante Microsoft 365 Copilot, pas le niveau Basic.", en:"Teams meeting summaries rely on your work data: they require the paid Microsoft 365 Copilot license, not the Basic tier."}},
{cat:"basic", q:{fr:"Pour quel type de tâches Copilot Basic est-il particulièrement adapté au quotidien ?", en:"What kind of tasks is Copilot Basic particularly suited for day to day?"}, opts:{fr:["Rédiger, résumer, reformuler, traduire et générer des idées","Analyser en autonomie l'intégralité de la base clients interne de l'entreprise","Administrer les serveurs, le réseau et l'infrastructure informatique de l'entreprise","Certifier des calculs financiers soumis à des obligations réglementaires strictes"], en:["Writing, summarizing, rephrasing, translating and generating ideas","Autonomously analyzing the company's entire internal customer database","Administering the company's servers, network and IT infrastructure","Certifying financial calculations subject to strict regulatory obligations"]}, correct:0, why:{fr:"Basic est une porte d'entrée idéale pour écrire, résumer, reformuler, traduire et brainstormer à partir du web et de vos entrées.", en:"Basic is an ideal entry point to write, summarize, rephrase, translate and brainstorm from the web and your inputs."}},
{cat:"basic", q:{fr:"Microsoft recommande aux utilisateurs professionnels d'accéder à Copilot Chat (Basic) via… ?", en:"Microsoft recommends professional users access Copilot Chat (Basic) via…?"}, opts:{fr:["Une invite de commande Windows","Exclusivement l'application Copilot grand public","L'application Microsoft 365 Copilot","Un plugin de navigateur tiers rendu obligatoire"], en:["A Windows command prompt","Exclusively the consumer Copilot app","The Microsoft 365 Copilot application","A mandatory third-party browser plugin"]}, correct:2, why:{fr:"Depuis 2026, Microsoft oriente les utilisateurs travail/éducation vers Copilot Chat dans l'application Microsoft 365 Copilot plutôt que vers l'app Copilot grand public.", en:"Since 2026, Microsoft steers work/education users toward Copilot Chat in the Microsoft 365 Copilot app rather than the consumer Copilot app."}},
{cat:"basic", q:{fr:"En période de forte affluence, à quoi un utilisateur Basic peut-il s'attendre côté modèles IA ?", en:"During peak demand, what can a Basic user expect on the AI models side?"}, opts:{fr:["Une priorité absolue accordée avant tous les utilisateurs payants du service","Un accès surtout en heures creuses, limité si la demande est forte","Un accès permanent et illimité aux tout derniers modèles disponibles","Aucun accès aux modèles : seulement des réponses pré-écrites standardisées"], en:["Absolute priority ahead of all paying users of the service","Access mostly in off-peak hours, limited when demand is high","Permanent, unlimited access to the very latest available models","No access to the models: only pre-written standardized responses"]}, correct:1, why:{fr:"Les utilisateurs gratuits accèdent surtout aux modèles en heures creuses et peuvent subir une limitation (throttling) ; le payant offre priorité et quotas plus élevés.", en:"Free users mainly access the models in off-peak hours and can be throttled; paid offers grant priority and higher quotas."}},
{cat:"basic", q:{fr:"Quand Copilot Basic répond à partir du web, qu'apporte-t-il souvent en plus du texte ?", en:"When Copilot Basic answers from the web, what does it often add beyond the text?"}, opts:{fr:["Une facturation supplémentaire appliquée à chacune de vos requêtes web","Une copie complète du site consulté, enregistrée sur votre disque dur","Des liens vers les sources web utilisées","Un accès administrateur temporaire au tenant de l'organisation"], en:["An extra charge applied to each of your web requests","A complete copy of the visited site, saved on your hard drive","Links to the web sources used","Temporary administrator access to the organization's tenant"]}, correct:2, why:{fr:"Les réponses web s'appuient sur une recherche (Bing) et citent généralement leurs sources, ce qui permet de vérifier l'information.", en:"Web answers rely on a search (Bing) and generally cite their sources, which lets you verify the information."}},
{cat:"basic", q:{fr:"Dans l'écosystème Copilot, qu'est-ce qu'un « agent » ?", en:"In the Copilot ecosystem, what is an 'agent'?"}, opts:{fr:["Un assistant IA spécialisé sur une tâche ou un domaine","Un simple raccourci clavier permettant d'ouvrir plus rapidement l'application Copilot","Un membre du support technique de Microsoft que l'on peut joindre par téléphone","Un type de licence pour administrateurs"], en:["An AI assistant specialized in a task or a domain","A simple keyboard shortcut that opens the Copilot application more quickly","A member of Microsoft technical support that you can reach by phone","A license type for administrators"]}, correct:0, why:{fr:"Un agent est un assistant IA spécialisé, configuré pour un usage ou un domaine précis (RH, informatique, analyse…) ; certains sont prêts à l'emploi dans Copilot Chat, d'autres se créent dans Copilot Studio.", en:"An agent is a specialized AI assistant, configured for a specific use or domain (HR, IT, analysis…); some are ready to use in Copilot Chat, others are built in Copilot Studio."}},
{cat:"basic", q:{fr:"Quel réflexe est recommandé face aux réponses de Copilot Basic ?", en:"What reflex is recommended toward Copilot Basic's answers?"}, opts:{fr:["Vérifier les informations importantes avant de les réutiliser","Les considérer comme systématiquement exactes en toutes circonstances","Ignorer par principe les sources citées dans les réponses","Les diffuser immédiatement sans aucune relecture préalable"], en:["Verify important information before reusing it","Consider them systematically accurate in all circumstances","Ignore, on principle, the sources cited in the answers","Share them immediately without any prior review"]}, correct:0, why:{fr:"Copilot peut commettre des erreurs : on relit et on vérifie les informations importantes, en s'aidant des sources fournies.", en:"Copilot can make mistakes: reread and verify important information, using the sources provided."}},
{cat:"basic", q:{fr:"Copilot Basic peut-il agir directement dans vos applications, par exemple modifier un classeur Excel à votre place ?", en:"Can Copilot Basic act directly in your apps, for example editing an Excel workbook for you?"}, opts:{fr:["Non : agir dans les apps relève du payant","Oui, il édite automatiquement tous vos fichiers sans intervention de votre part","Oui, mais exclusivement à l'intérieur de PowerPoint et nulle part ailleurs","Oui, exactement de la même façon que dans les offres payantes"], en:["No: acting inside apps belongs to the paid offer","Yes, it automatically edits all your files without any input from you","Yes, but exclusively inside PowerPoint and nowhere else","Yes, exactly the same way as in the paid offers"]}, correct:0, why:{fr:"L'intégration profonde qui laisse Copilot agir dans Word/Excel/PowerPoint relève de la licence payante ; en Basic, on travaille surtout via le chat, puis copier-coller.", en:"The deep integration that lets Copilot act inside Word/Excel/PowerPoint belongs to the paid license; in Basic you mostly work through the chat, then copy-paste."}},
{cat:"basic", q:{fr:"Où un utilisateur de Copilot Chat (Basic) trouve-t-il de nouveaux agents à utiliser ?", en:"Where does a Copilot Chat (Basic) user find new agents to use?"}, opts:{fr:["Dans le magasin d'agents intégré (Agent Store)","Nulle part : il est tout simplement impossible d'ajouter de nouveaux agents dans Copilot","Uniquement en contactant directement l'éditeur Microsoft par courrier postal recommandé","Seulement en développant soi-même chaque agent en langage machine avant de l'utiliser"], en:["In the built-in agent store (Agent Store)","Nowhere: it is simply impossible to add any new agents in Copilot at all","Only by contacting the Microsoft vendor directly by registered postal mail","Only by developing each agent yourself in machine language before using it"]}, correct:0, why:{fr:"Copilot propose un magasin d'agents (Agent Store) où l'on découvre et ajoute des agents prêts à l'emploi publiés par Microsoft, des éditeurs tiers ou l'organisation ; certains agents sont facturés à l'usage.", en:"Copilot offers an agent store (Agent Store) where you discover and add ready-to-use agents published by Microsoft, third-party vendors or your organization; some agents are billed per use."}},
{cat:"basic", q:{fr:"Après une première réponse, vous voulez l'ajuster (plus court, autre ton). Comment faire en Basic ?", en:"After a first answer, you want to adjust it (shorter, different tone). How do you do it in Basic?"}, opts:{fr:["Continuer la même conversation : Copilot en garde le fil","Repartir de zéro à chaque fois, car il ne conserve aucun contexte","C'est une possibilité strictement réservée à l'offre payante","Recréer systématiquement un compte avant chaque nouvelle demande"], en:["Continue the conversation: Copilot keeps the thread","Start from scratch each time, since it keeps no context","It's a possibility strictly reserved for the paid offer","Recreate an account before every new request"]}, correct:0, why:{fr:"Copilot Basic suit le fil de la conversation : on peut enchaîner « raccourcis-le », « plus formel » ou « traduis-le » sans tout réécrire, jusqu'à obtenir le résultat voulu.", en:"Copilot Basic follows the conversation thread: you can chain 'shorten it', 'more formal' or 'translate it' without rewriting everything, until you get the result you want."}},
{cat:"basic", q:{fr:"Copilot Chat (Basic) est-il payant pour un utilisateur ayant un compte professionnel Microsoft 365 ?", en:"Is Copilot Chat (Basic) paid for a user with a Microsoft 365 professional account?"}, opts:{fr:["Non, il est inclus sans licence Copilot payante","Oui, il exige la licence add-on Microsoft 365 Copilot facturée par utilisateur","Oui, il nécessite l'abonnement individuel Copilot Pro en plus du compte professionnel","Oui, uniquement après l'achat de crédits pay-as-you-go par l'administrateur"], en:["No, it's included without a paid Copilot license","Yes, it requires the Microsoft 365 Copilot add-on license billed per user","Yes, it requires the individual Copilot Pro subscription on top of the pro account","Yes, only after the administrator buys pay-as-you-go credits"]}, correct:0, why:{fr:"Copilot Chat (Basic) est inclus pour les comptes professionnels éligibles, sans licence Microsoft 365 Copilot payante ; celle-ci n'est requise que pour l'ancrage dans les données de travail et les intégrations avancées.", en:"Copilot Chat (Basic) is included for eligible professional accounts, without a paid Microsoft 365 Copilot license; that license is only required for grounding in work data and advanced integrations."}},
{cat:"basic", q:{fr:"Copilot Basic peut-il rédiger et traduire dans plusieurs langues ?", en:"Can Copilot Basic write and translate in several languages?"}, opts:{fr:["Non, il fonctionne uniquement en anglais quelle que soit la langue demandée","Oui, il prend en charge de nombreuses langues","Uniquement si l'administrateur installe au préalable un module linguistique payant","Seulement pour traduire, jamais pour rédiger dans une autre langue"], en:["No, it works only in English whatever the requested language","Yes, it supports many languages","Only if the administrator first installs a paid language module","Only to translate, never to write in another language"]}, correct:1, why:{fr:"Copilot Basic est multilingue : il peut comprendre, rédiger et traduire dans de nombreuses langues, sans configuration particulière.", en:"Copilot Basic is multilingual: it can understand, write and translate in many languages, without any special configuration."}},
{cat:"basic", q:{fr:"Où un utilisateur peut-il accéder à Copilot Chat (Basic) en déplacement ?", en:"Where can a user access Copilot Chat (Basic) on the go?"}, opts:{fr:["Nulle part : Basic est strictement réservé aux ordinateurs de bureau","Uniquement via un accès distant à un serveur installé dans l'entreprise","Dans l'application mobile Microsoft 365 Copilot","Seulement à travers une extension de navigateur payante à installer"], en:["Nowhere: Basic is strictly reserved for desktop computers","Only through remote access to a server installed at the company","In the Microsoft 365 Copilot mobile app","Only via a paid browser extension you must install"]}, correct:2, why:{fr:"Copilot Chat est accessible sur mobile via l'application Microsoft 365 Copilot (iOS et Android), en plus du navigateur et du bureau.", en:"Copilot Chat is available on mobile through the Microsoft 365 Copilot app (iOS and Android), in addition to the browser and desktop."}},
{cat:"basic", q:{fr:"Entre deux conversations distinctes, Copilot Basic garde-t-il par défaut le contenu de la précédente ?", en:"Between two distinct conversations, does Copilot Basic keep the previous one's content by default?"}, opts:{fr:["Non, chaque nouvelle conversation repart de zéro","Oui, il mémorise durablement l'ensemble de vos conversations passées, automatiquement","Oui, mais seulement les conversations datant de moins de sept jours","Uniquement si vous activez une mémoire réservée aux offres payantes"], en:["No, each new conversation starts from scratch","Yes, it durably memorizes all your past conversations, automatically","Yes, but only conversations less than seven days old","Only if you enable a memory reserved for paid offers"]}, correct:0, why:{fr:"Par défaut, chaque nouvelle conversation démarre sans le contexte des précédentes ; à l'intérieur d'une même conversation, en revanche, Copilot suit le fil.", en:"By default, each new conversation starts without the context of previous ones; within a single conversation, however, Copilot follows the thread."}},
{cat:"basic", type:"click", q:{fr:"Cliquez sur l'élément permettant de démarrer une nouvelle conversation avec Copilot.", en:"Click the element that lets you start a new conversation with Copilot."}, image:SCREENSHOT_1, hotspot:{x:0.52,y:12.15,w:12.52,h:4.86}, why:{fr:"Le bouton \"Nouvelle conversation\" dans le panneau latéral permet de démarrer un nouvel échange avec Copilot, distinct de l'historique des conversations précédentes.", en:"The 'New conversation' button in the side panel lets you start a new exchange with Copilot, separate from the history of previous conversations."}},
{cat:"premium", q:{fr:"Que faut-il obligatoirement posséder avant de pouvoir ajouter la licence M365 Copilot (Premium) payante ?", en:"What must you mandatorily own before you can add the paid M365 Copilot (Premium) license?"}, opts:{fr:["Un plan de base Microsoft 365 éligible (Business ou Enterprise)","Absolument rien : cette licence peut s'acheter de façon totalement autonome et isolée","Uniquement un compte Azure strictement personnel, sans aucun abonnement Microsoft 365","Une licence Copilot Studio acquise au préalable, sans aucune autre condition requise"], en:["An eligible Microsoft 365 base plan (Business or Enterprise)","Absolutely nothing: this license can be bought fully standalone and in isolation","Only a strictly personal Azure account, without any Microsoft 365 subscription","A Copilot Studio license acquired beforehand, with no other condition required"]}, correct:0, why:{fr:"Le Copilot payant est un add-on : il ne se vend pas seul et nécessite un plan de base éligible (Business Basic/Standard/Premium, Microsoft 365 E3/E5, Office 365 E1/E3/E5, etc.).", en:"The paid Copilot is an add-on: it isn't sold alone and requires an eligible base plan (Business Basic/Standard/Premium, Microsoft 365 E3/E5, Office 365 E1/E3/E5, etc.)."}},
{cat:"premium", q:{fr:"Sur quoi repose principalement l'ancrage des réponses de Copilot Premium ?", en:"What does Copilot Premium's grounding primarily rely on?"}, opts:{fr:["Le Microsoft Graph et Work IQ (emails, fichiers, réunions)","Uniquement des recherches effectuées sur le web public, exactement comme en Basic","Une base de connaissances totalement figée, mise à jour manuellement une fois par an","Les réseaux sociaux reliés au compte"], en:["The Microsoft Graph and Work IQ (emails, files, meetings)","Only searches performed on the public web, exactly like in Basic","A completely frozen knowledge base, updated manually once a year","The social networks linked to the account"]}, correct:0, why:{fr:"Premium ajoute une intégration profonde via le Microsoft Graph et Work IQ, permettant à Copilot de raisonner sur les données réelles de travail de l'utilisateur.", en:"Premium adds deep integration via the Microsoft Graph and Work IQ, letting Copilot reason over the user's real work data."}},
{cat:"premium", q:{fr:"Qu'est-il advenu de l'offre individuelle \"Copilot Pro\" ?", en:"What became of the individual 'Copilot Pro' offer?"}, opts:{fr:["Elle a simplement été renommée en Copilot Studio","Retirée fin 2025, ses fonctionnalités sont reprises par Microsoft 365 Premium","Elle est devenue totalement gratuite et illimitée pour absolument tous les utilisateurs","Elle a fusionné directement avec l'offre Copilot Cowork"], en:["It was simply renamed Copilot Studio","Retired at the end of 2025, its features are carried by Microsoft 365 Premium","It became completely free for all users","It merged directly with the Copilot Cowork offer, losing its own separate identity entirely"]}, correct:1, why:{fr:"Microsoft a retiré l'offre autonome Copilot Pro (20$/mois) fin 2025 ; ses fonctionnalités sont désormais portées par Microsoft 365 Premium (environ 19,99$/mois) pour les particuliers.", en:"Microsoft retired the standalone Copilot Pro offer ($20/month) at the end of 2025; its features are now carried by Microsoft 365 Premium (about $19.99/month) for consumers."}},
{cat:"premium", q:{fr:"Le Microsoft 365 E7 Frontier Suite regroupe quels éléments dans une seule offre ?", en:"What does the Microsoft 365 E7 Frontier Suite bundle into a single offer?"}, opts:{fr:["M365 E5, Microsoft 365 Copilot et Agent 365","Uniquement les licences Microsoft Teams et Outlook réunies dans un même forfait","Seulement Copilot Studio accompagné des licences Power BI Premium par capacité","Exclusivement des licences Windows Entreprise pour l'ensemble des postes de travail"], en:["M365 E5, Microsoft 365 Copilot and Agent 365","Only the Microsoft Teams and Outlook licenses combined into one plan","Only Copilot Studio together with Power BI Premium per-capacity licenses","Exclusively Windows Enterprise licenses for all of the workstations"]}, correct:0, why:{fr:"Le E7 Frontier Suite (lancé en mai 2026) regroupe M365 E5, Microsoft 365 Copilot et Agent 365 dans une seule offre, à un tarif souvent plus avantageux que l'achat séparé.", en:"The E7 Frontier Suite (launched in May 2026) bundles M365 E5, Microsoft 365 Copilot and Agent 365 into a single offer, often at a better price than buying separately."}},
{cat:"premium", q:{fr:"Outre les modèles OpenAI (GPT), quels autres modèles sont proposés dans le sélecteur de modèle de Microsoft 365 Copilot ?", en:"Beyond OpenAI (GPT) models, which other models are offered in the Microsoft 365 Copilot model picker?"}, opts:{fr:["Des modèles Anthropic comme Claude Opus","Uniquement des modèles développés entièrement en interne par les équipes de Microsoft","Seulement des modèles open-source anciens, non maintenus par un quelconque éditeur","Aucun autre modèle n'est jamais proposé aux utilisateurs, quel que soit le besoin réel"], en:["Anthropic models such as Claude Opus","Only models developed entirely in-house by Microsoft's teams","Only old open-source models, not maintained by any vendor","No other model is ever offered to users, whatever the actual need"]}, correct:0, why:{fr:"Microsoft 365 Copilot propose un choix multi-modèle incluant des modèles Anthropic (comme Claude Opus 4.7/4.8) pour les tâches complexes, multi-étapes et de longue durée.", en:"Microsoft 365 Copilot offers a multi-model choice including Anthropic models (such as Claude Opus 4.7/4.8) for complex, multi-step, long-running tasks."}},
{cat:"premium", q:{fr:"Que reçoivent en plus les clients Enterprise au tarif Copilot à 30$/utilisateur/mois ?", en:"What do Enterprise customers additionally receive at the $30/user/month Copilot rate?"}, opts:{fr:["Copilot for Sales, Service et Finance, inclus sans surcoût","Rien de plus : Copilot for Sales reste facturé entièrement à part, comme auparavant","Un simple accès prioritaire au support technique de Microsoft, et absolument rien d'autre","Des crédits Azure offerts, entièrement gratuits et totalement illimités chaque mois"], en:["Copilot for Sales, Service and Finance, included at no extra cost","Nothing more: Copilot for Sales is still billed entirely separately, as before","Simply priority access to Microsoft technical support, and nothing else","Free Azure credits, entirely free and completely unlimited every month"]}, correct:0, why:{fr:"Les clients Enterprise au tarif standard reçoivent désormais Copilot for Sales, Copilot for Service et Copilot for Finance groupés sans coût supplémentaire.", en:"Enterprise customers at the standard rate now receive Copilot for Sales, Copilot for Service and Copilot for Finance bundled at no additional cost."}},
{cat:"premium", q:{fr:"Quelle affirmation décrit le mieux la distinction entre Copilot Business et Copilot Enterprise ?", en:"Which statement best describes the distinction between Copilot Business and Copilot Enterprise?"}, opts:{fr:["Business cible les petites organisations ; Enterprise les grandes (conformité E5)","Ce sont deux marques totalement concurrentes, développées sans aucun lien entre elles","Enterprise n'inclut strictement aucune fonctionnalité d'IA, contrairement à Business","Business est réservé uniquement aux comptes administrateurs globaux du tenant Microsoft"], en:["Business targets small organizations; Enterprise the large ones (E5 compliance)","They are two entirely competing brands, developed by two different vendors with no link at all","Enterprise includes strictly no AI feature, unlike Business","Business is reserved only for the tenant's global administrator accounts"]}, correct:0, why:{fr:"Le tarif Business cible les organisations en dessous d'un certain seuil d'utilisateurs et s'appuie sur les plans Business, alors qu'Enterprise s'adresse aux organisations plus grandes avec des besoins de conformité E5.", en:"The Business rate targets organizations below a certain user threshold and builds on Business plans, while Enterprise addresses larger organizations with E5 compliance needs."}},
{cat:"premium", q:{fr:"Quel est le principal avantage fonctionnel qu'apporte la grounding via Work IQ dans Copilot Premium ?", en:"What is the main functional benefit that grounding via Work IQ brings in Copilot Premium?"}, opts:{fr:["Comprendre le contexte de travail réel propre à l'utilisateur","Contourner les permissions d'accès déjà en place sur les fichiers de l'organisation","Chiffrer automatiquement l'intégralité des fichiers personnels de chaque utilisateur","Désactiver les mises à jour de sécurité automatiques afin d'accélérer les réponses"], en:["Understanding the user's real day-to-day work context","Bypassing the access permissions already in place on the organization's files","Automatically encrypting the entirety of each user's personal files","Disabling automatic security updates in order to speed up responses"]}, correct:0, why:{fr:"Work IQ agrège les signaux de travail (emails, réunions, chats, fichiers) pour donner à Copilot une compréhension contextuelle réelle du travail de l'utilisateur, plutôt que de se limiter au web.", en:"Work IQ aggregates work signals (emails, meetings, chats, files) to give Copilot a real contextual understanding of the user's work, rather than being limited to the web."}},
{cat:"premium", q:{fr:"Depuis mai 2026, quel modèle Anthropic étend le choix de modèle pour les tâches complexes dans Microsoft 365 Copilot ?", en:"Since May 2026, which Anthropic model extends the model choice for complex tasks in Microsoft 365 Copilot?"}, opts:{fr:["Claude Opus 4.8","Claude 1.0 historique","Un modèle sans nom, réservé aux tests internes","GPT-3.5 uniquement"], en:["Claude Opus 4.8","The historical Claude 1.0","An unnamed model, reserved for internal testing","GPT-3.5 only"]}, correct:0, why:{fr:"Claude Opus 4.8 d'Anthropic est disponible depuis mai 2026, étendant le choix de modèle pour des scénarios de travail plus avancés, avec un meilleur suivi des instructions et une sélection d'outils améliorée.", en:"Anthropic's Claude Opus 4.8 has been available since May 2026, extending the model choice for more advanced work scenarios, with better instruction-following and improved tool selection."}},
{cat:"premium", q:{fr:"Quelles capacités sont désormais généralement disponibles dans Word, Excel et PowerPoint, permettant à Copilot de planifier et exécuter du travail multi-étapes ?", en:"Which capabilities are now generally available in Word, Excel and PowerPoint, letting Copilot plan and run multi-step work?"}, opts:{fr:["Les capacités agentiques","Uniquement la correction orthographique avancée","La suppression automatique de fichiers dupliqués","Le chiffrement de bout en bout des documents"], en:["Agentic capabilities","Only advanced spell-checking","Automatic removal of duplicate files","End-to-end encryption of documents"]}, correct:0, why:{fr:"Les capacités agentiques sont désormais généralement disponibles dans Word, Excel et PowerPoint, permettant à Copilot de planifier, exécuter et affiner un travail multi-étapes directement dans les applications quotidiennes.", en:"Agentic capabilities are now generally available in Word, Excel and PowerPoint, letting Copilot plan, execute and refine multi-step work directly in the everyday apps."}},
{cat:"premium", q:{fr:"Le Legal Agent dans Word est-il accessible sans licence Microsoft 365 Copilot ?", en:"Is the Legal Agent in Word accessible without a Microsoft 365 Copilot license?"}, opts:{fr:["Non, il relève des capacités agentiques de Microsoft 365 Copilot","Oui, il est proposé gratuitement à absolument tous les utilisateurs de Word","Oui, mais uniquement sur invitation spéciale accordée à titre entièrement gracieux","Non, il exige une licence Copilot Studio distincte, sans aucune autre possibilité"], en:["No, it belongs to the agentic capabilities of Microsoft 365 Copilot","Yes, it is offered free to absolutely all Word users","Yes, but only by special invitation granted entirely free of charge","No, it requires a separate Copilot Studio license, with no other option"]}, correct:0, why:{fr:"Le Legal Agent, comme les autres agents spécialisés avancés dans Word, s'inscrit dans les capacités agentiques de Microsoft 365 Copilot liées à la licence payante.", en:"The Legal Agent, like the other advanced specialized agents in Word, is part of the agentic capabilities of Microsoft 365 Copilot tied to the paid license."}},
{cat:"premium", q:{fr:"Microsoft 365 Copilot (Premium) inclut des agents prêts à l'emploi. Lesquels en sont des exemples ?", en:"Microsoft 365 Copilot (Premium) includes ready-to-use agents. Which are examples of them?"}, opts:{fr:["Des agents prêts à l'emploi comme Researcher et Analyst","Aucun : il faut acheter chacun des agents séparément sur une place de marché externe","Uniquement des agents créés entièrement à la main par l'administrateur du tenant client","Seulement des agents de jeu"], en:["Ready-to-use agents such as Researcher and Analyst","None: you must buy each of the agents separately on an external marketplace","Only agents built entirely by hand by the administrator of the client tenant","Only game agents"]}, correct:0, why:{fr:"Microsoft 365 Copilot inclut des agents de raisonnement prêts à l'emploi comme Researcher (recherche approfondie) et Analyst (analyse de données), en plus des agents personnalisés créés dans Copilot Studio.", en:"Microsoft 365 Copilot includes ready-to-use reasoning agents such as Researcher (deep research) and Analyst (data analysis), in addition to the custom agents built in Copilot Studio."}},
{cat:"premium", q:{fr:"Que permet Work IQ concernant les rapports et modèles sémantiques Power BI pour les utilisateurs Copilot ?", en:"What does Work IQ enable regarding Power BI reports and semantic models for Copilot users?"}, opts:{fr:["Poser des questions en langage naturel ancrées dans les rapports Power BI","Supprimer définitivement l'ensemble des rapports Power BI déjà existants dans le tenant","Remplacer purement et simplement Power BI par Excel dans toute l'organisation cliente","Bloquer tout accès aux données Power BI, officiellement pour une raison de sécurité"], en:["Asking questions in natural language grounded in Power BI reports","Permanently deleting all existing Power BI reports in the tenant","Purely and simply replacing Power BI with Excel across the whole client organization","Blocking all access to Power BI data, officially for a security reason"]}, correct:0, why:{fr:"Avec Work IQ, Microsoft 365 Copilot peut désormais raisonner sur les données d'entreprise Power BI, permettant de poser des questions en langage naturel et d'obtenir des réponses ancrées directement dans les rapports.", en:"With Work IQ, Microsoft 365 Copilot can now reason over Power BI enterprise data, letting you ask natural-language questions and get answers grounded directly in the reports."}},
{cat:"premium", q:{fr:"Copilot dans Word modifie-t-il désormais le document par défaut, plutôt que de se limiter à suggérer ?", en:"Does Copilot in Word now edit the document by default, rather than only suggesting?"}, opts:{fr:["Oui, depuis la mise à jour de juin 2026, il édite le document par défaut","Non, il se contente de suggérer et ne modifie jamais directement le moindre contenu","Non, cette fonctionnalité d'édition directe a finalement été retirée assez récemment","Oui, mais exclusivement pour les fichiers dont la longueur reste inférieure à une page"], en:["Yes, since the June 2026 update, it edits the document by default","No, it only suggests and never directly modifies any content","No, this direct-editing feature was ultimately removed fairly recently","Yes, but exclusively for files whose length stays under one page"]}, correct:0, why:{fr:"Depuis juin 2026, Copilot dans Word édite directement le document par défaut, une évolution vers un mode d'édition plus agentique.", en:"Since June 2026, Copilot in Word edits the document directly by default, a shift toward a more agentic editing mode."}},
{cat:"premium", q:{fr:"Quel avantage un agent obtient-il sous licence Microsoft 365 Copilot (Premium) par rapport à Basic ?", en:"What advantage does an agent gain under a Microsoft 365 Copilot (Premium) license compared to Basic?"}, opts:{fr:["Il peut s'ancrer sur vos données de travail via le Graph","Il fonctionne totalement hors connexion, sans jamais aucun accès au réseau de l'entreprise","Il supprime automatiquement l'ensemble des fichiers qu'il juge inutiles dans le tenant","Il s'exécute uniquement la nuit afin de ne jamais ralentir le poste de travail de l'usager"], en:["It can be grounded on your work data via the Graph","It works completely offline, without ever any access to the company network at all","It automatically deletes all of the files it deems useless within the tenant","It runs only at night so as never to slow down the user's workstation in any way"]}, correct:0, why:{fr:"Avec la licence M365 Copilot, les agents peuvent s'ancrer sur vos données de travail via le Microsoft Graph et Work IQ (emails, fichiers, réunions), là où Basic se limite au web et à ce que vous fournissez.", en:"With the M365 Copilot license, agents can be grounded on your work data via the Microsoft Graph and Work IQ (emails, files, meetings), whereas Basic is limited to the web and what you provide."}},
{cat:"premium", type:"click", q:{fr:"Sur cette interface Copilot, cliquez sur le badge qui indique que les réponses s'appuient sur le contexte de travail de l'organisation.", en:"On this Copilot interface, click the badge indicating that answers rely on the organization's work context."}, image:SCREENSHOT_1, hotspot:{x:14.08,y:1.5,w:4.07,h:3.7}, why:{fr:"Le badge \"Work IQ\" indique que Copilot ancre ses réponses dans le contexte de travail réel de l'utilisateur (emails, fichiers, réunions, chats Teams), plutôt que de se limiter au web.", en:"The 'Work IQ' badge indicates that Copilot grounds its answers in the user's real work context (emails, files, meetings, Teams chats), rather than being limited to the web."}},
{cat:"premium", type:"click", q:{fr:"Cliquez sur le sélecteur qui permet de changer le modèle IA utilisé par Copilot (actuellement réglé sur \"Automatique\").", en:"Click the selector that lets you change the AI model used by Copilot (currently set to 'Automatic')."}, image:SCREENSHOT_1, hotspot:{x:18.94,y:1.5,w:5.22,h:3.7}, why:{fr:"Ce sélecteur de modèle permet de choisir le modèle IA utilisé (ou de laisser Copilot choisir automatiquement), parmi une gamme incluant des modèles OpenAI et Anthropic selon la tâche.", en:"This model selector lets you choose the AI model used (or let Copilot choose automatically), from a range including OpenAI and Anthropic models depending on the task."}},
{cat:"premium", type:"click", q:{fr:"Cliquez sur l'entrée du menu qui permet de rechercher un fichier, une personne ou un contenu de votre entreprise.", en:"Click the menu entry that lets you search for a file, a person or content from your company."}, image:SCREENSHOT_1, hotspot:{x:0.5,y:17,w:11,h:3.2}, why:{fr:"« Rechercher » interroge le contenu de l'organisation (fichiers, personnes, contenus M365). Cette recherche d'entreprise s'appuie sur l'ancrage dans les données de travail, propre à Copilot Premium ; Basic se limite au web.", en:"'Search' queries the organization's content (files, people, M365 content). This enterprise search relies on grounding in work data, specific to Copilot Premium; Basic is limited to the web."}},
{cat:"premium", type:"click", q:{fr:"Cliquez sur l'endroit où retrouver les pages et contenus que vous créez avec Copilot.", en:"Click where you can find the pages and content you create with Copilot."}, image:SCREENSHOT_1, hotspot:{x:0.5,y:21,w:11,h:3.2}, why:{fr:"La « Bibliothèque » regroupe les pages et images générées avec Copilot, pour les retrouver, les rouvrir et les réutiliser.", en:"The 'Library' gathers the pages and images generated with Copilot, so you can find, reopen and reuse them."}},
{cat:"premium", type:"click", q:{fr:"Sous la barre de saisie, cliquez sur la suggestion qui ancre la demande dans votre messagerie.", en:"Below the input bar, click the suggestion that grounds the request in your mailbox."}, image:SCREENSHOT_1, hotspot:{x:47.3,y:61.5,w:4.4,h:4}, why:{fr:"La suggestion « E-mails » oriente Copilot vers votre boîte de réception : ce type d'ancrage dans vos données de travail (via Microsoft Graph) est caractéristique de Copilot Premium.", en:"The 'Emails' suggestion points Copilot to your inbox: this kind of grounding in your work data (via Microsoft Graph) is characteristic of Copilot Premium."}},
{cat:"cowork", q:{fr:"Quelle est la différence fondamentale entre Copilot Chat classique et Copilot Cowork ?", en:"What is the fundamental difference between classic Copilot Chat and Copilot Cowork?"}, opts:{fr:["Cowork exécute des tâches multi-étapes de façon autonome","Cowork se contente de répondre à des questions, exactement comme le chat classique","Cowork est un outil réservé exclusivement aux équipes de développeurs expérimentés","Il n'existe strictement aucune différence : ce sont rigoureusement les mêmes fonctions"], en:["Cowork runs multi-step tasks autonomously","Cowork merely answers questions, exactly like the classic chat","Cowork is a tool reserved exclusively for experienced developer teams","There is strictly no difference: they are exactly the same features"]}, correct:0, why:{fr:"Cowork pousse Copilot au-delà de la conversation : on décrit une tâche, et Cowork envoie des emails, planifie des réunions, crée des documents, publie dans Teams et gère le calendrier à la place de l'utilisateur.", en:"Cowork pushes Copilot beyond conversation: you describe a task, and Cowork sends emails, schedules meetings, creates documents, posts to Teams and manages the calendar on the user's behalf."}},
{cat:"cowork", q:{fr:"Avant d'exécuter une action sensible comme envoyer un email ou publier dans Teams, que fait Copilot Cowork ?", en:"Before performing a sensitive action such as sending an email or posting to Teams, what does Copilot Cowork do?"}, opts:{fr:["Il demande votre approbation via un aperçu avant d'agir","Il exécute directement l'action demandée sans jamais prévenir au préalable l'utilisateur","Il patiente systématiquement vingt-quatre heures avant d'entreprendre la moindre action","Il envoie seulement une notification après coup, sans aucune étape de validation possible"], en:["It asks for your approval via a preview before acting","It runs the requested action directly, without ever warning the user beforehand","It systematically waits twenty-four hours before undertaking any action","It only sends a notification afterward, with no possible validation step"]}, correct:0, why:{fr:"Cowork affiche une boîte de dialogue d'approbation avec un aperçu de l'action prévue (par exemple Envoyer, Publier, Créer) : l'utilisateur reste maître de chaque étape sensible.", en:"Cowork shows an approval dialog with a preview of the planned action (for example Send, Post, Create): the user stays in control of each sensitive step."}},
{cat:"cowork", q:{fr:"Sur quel moteur de contexte Copilot Cowork s'appuie-t-il pour ancrer son travail ?", en:"What context engine does Copilot Cowork rely on to ground its work?"}, opts:{fr:["Work IQ, qui puise dans les signaux Outlook, Teams et Excel","Une base de données statique mise à jour manuellement","Uniquement des recherches effectuées sur le web public","Aucun moteur de contexte, il travaille entièrement à l'aveugle"], en:["Work IQ, which draws on Outlook, Teams and Excel signals","A static database updated manually","Only searches performed on the public web","No context engine at all; it works entirely blind, with no grounding whatsoever"]}, correct:0, why:{fr:"Cowork est propulsé par Work IQ, qui agrège les signaux de travail de l'utilisateur (Outlook, Teams, Excel, etc.) pour ancrer ses actions dans le contexte réel.", en:"Cowork is powered by Work IQ, which aggregates the user's work signals (Outlook, Teams, Excel, etc.) to ground its actions in the real context."}},
{cat:"cowork", q:{fr:"Copilot Cowork s'appuie en partie sur une technologie développée en partenariat avec quelle entreprise ?", en:"Copilot Cowork relies in part on technology developed in partnership with which company?"}, opts:{fr:["Anthropic, dont la technologie de Claude Cowork a été intégrée à Copilot","OpenAI exclusivement, sans jamais aucun autre partenaire technologique impliqué","Google, à travers un partenariat stratégique annoncé tout récemment par Microsoft","Une startup strictement interne à Microsoft, développée dans la plus grande discrétion"], en:["Anthropic, whose Claude Cowork technology was integrated into Copilot","OpenAI exclusively, without ever any other technology partner involved","Google, through a strategic partnership announced very recently by Microsoft","A strictly Microsoft-internal startup, developed in the utmost discretion"]}, correct:0, why:{fr:"Microsoft a travaillé avec Anthropic pour intégrer la technologie derrière Claude Cowork à Microsoft 365 Copilot, illustrant l'approche multi-modèle de Copilot.", en:"Microsoft worked with Anthropic to integrate the technology behind Claude Cowork into Microsoft 365 Copilot, illustrating Copilot's multi-model approach."}},
{cat:"cowork", q:{fr:"Pendant que Cowork exécute une tâche longue, que peut faire l'utilisateur ?", en:"While Cowork runs a long task, what can the user do?"}, opts:{fr:["Continuer à travailler : Cowork s'exécute en arrière-plan","Rien : il doit fixer l'écran sans rien toucher jusqu'à la toute fin du traitement","Fermer entièrement sa session, car la tâche s'annule dès qu'il fait autre chose","Uniquement patienter, écran bloqué"], en:["Keep working: Cowork runs in the background","Nothing: they must stare at the screen without touching anything until the very end","Fully close their session, since the task cancels the moment they do something else","Just wait, with a frozen screen"]}, correct:0, why:{fr:"Cowork travaille de façon asynchrone : une fois la tâche lancée, il s'exécute en arrière-plan et notifie l'utilisateur pour les validations et à la fin, qui peut continuer à travailler.", en:"Cowork works asynchronously: once a task is launched it runs in the background and notifies the user for approvals and on completion, so the user can keep working meanwhile."}},
{cat:"cowork", q:{fr:"Une tâche confiée à Cowork peut-elle couvrir plusieurs applications Microsoft 365 en une seule fois ?", en:"Can a task handed to Cowork span several Microsoft 365 apps at once?"}, opts:{fr:["Oui : une même tâche peut toucher Word, Outlook, Teams, etc.","Non, chaque tâche est strictement limitée à une seule application, sans aucune exception","Non, Cowork ne fonctionne qu'avec Excel et rien d'autre dans tout l'écosystème","Oui, mais seulement si l'administrateur relie manuellement chaque application au préalable"], en:["Yes: a single task can touch Word, Outlook, Teams, etc.","No, each task is strictly limited to a single application, without any exception","No, Cowork works only with Excel and nothing else in the whole ecosystem","Yes, but only if the administrator manually links each application beforehand"]}, correct:0, why:{fr:"Cowork orchestre une tâche de bout en bout à travers plusieurs applications : il peut par exemple créer un document Word, l'envoyer par Outlook et publier un message dans Teams dans un même enchaînement.", en:"Cowork orchestrates a task end to end across several apps: it can, for example, create a Word document, send it via Outlook and post a message in Teams in a single chain."}},
