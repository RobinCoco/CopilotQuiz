function startTimer(){
  clearTimer();
  timeLeft = MAX_TIME;
  questionStart = Date.now();
  updateTimerUI();
  timerHandle = setInterval(()=>{
    const elapsed = (Date.now()-questionStart)/1000;
    timeLeft = Math.max(0, MAX_TIME - elapsed);
    updateTimerUI();
    if(timeLeft<=0){
      clearTimer();
      handleTimeout();
    }
  }, 100);
}

function clearTimer(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle=null; }
}

function updateTimerUI(){
  const ring = document.getElementById("timer-ring");
  const num = document.getElementById("timer-num");
  if(ring){
    const r = 24;
    const circ = 2*Math.PI*r;
    const offset = circ * (1 - timeLeft/MAX_TIME);
    ring.style.strokeDashoffset = offset.toFixed(1);
    if(timeLeft < MAX_TIME*0.25) ring.style.stroke = "var(--bad)";
    else if(timeLeft < MAX_TIME*0.5) ring.style.stroke = "var(--amber)";
    else ring.style.stroke = "var(--good)";
  }
  if(num) num.textContent = Math.ceil(timeLeft);
}

function handleTimeout(){
  if(state.answered) return;
  const qIndex = state.order[state.idx];
  const q = QUESTIONS[qIndex];
  state.answered = true;
  state.selected = -1;
  state.lastPoints = 0;
  state.lastElapsed = MAX_TIME;
  state.scores[q.cat].total++;
  (state.review = state.review || []).push({qi:qIndex, ok:false, sel:-1});
  render();
  saveProgress();
}

function startQuiz(catId){
  state.view = "quiz";
  state.activeCat = catId;
  const order = shuffle(QUESTIONS.map((q,i)=>i).filter(i=>QUESTIONS[i].cat===catId));
  state.order = order;
  state.optionOrder = {};
  state.order.forEach(i => { state.optionOrder[i] = shuffle([0,1,2,3]); });
  state.idx = 0;
  state.answered = false;
  state.selected = null;
  state.sessionPoints = 0;
  state.pendingResume = null;
  state.review = [];
  state.isReplay = false;
  render();
  saveProgress();
}

function handleQuizKey(e){
  if(state.view!=="quiz") return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  var tag=(document.activeElement&&document.activeElement.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA") return;
  var qi=state.order[state.idx];
  var q=QUESTIONS[qi];
  if(!state.answered){
    if(q.type!=="click"){
      var map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
      var k=(e.key||"").toLowerCase();
      if(k in map){
        var disp=map[k], om=state.optionOrder[qi];
        if(om && disp<om.length){ e.preventDefault(); selectAnswer(om[disp]); }
      }
    }
  } else {
    if(e.key==="ArrowRight"){ e.preventDefault(); nextQuestion(); }
    else if(e.key==="Enter" && tag!=="BUTTON"){ e.preventDefault(); nextQuestion(); }
  }
}

function selectAnswer(i){
  if(state.answered) return;
  clearTimer();
  const elapsed = Math.min(MAX_TIME, (Date.now()-questionStart)/1000);
  const qIndex = state.order[state.idx];
  const q = QUESTIONS[qIndex];
  state.answered = true;
  state.selected = i;
  state.lastElapsed = elapsed;
  state.scores[q.cat].total++;
  let pts = 0;
  if(i===q.correct){
    state.scores[q.cat].correct++;
    const speedRatio = Math.max(0, Math.min(1, elapsed/MAX_TIME));
    pts = Math.max(20, Math.round(100 - speedRatio*80));
  }
  (state.review = state.review || []).push({qi:qIndex, ok:(i===q.correct), sel:i});
  state.lastPoints = pts;
  state.sessionPoints += pts;
  render();
  saveProgress();
}

function selectClickAnswer(xPct, yPct){
  if(state.answered) return;
  clearTimer();
  const elapsed = Math.min(MAX_TIME, (Date.now()-questionStart)/1000);
  const qIndex = state.order[state.idx];
  const q = QUESTIONS[qIndex];
  const hs = q.hotspot;
  const hit = xPct>=hs.x && xPct<=(hs.x+hs.w) && yPct>=hs.y && yPct<=(hs.y+hs.h);
  state.answered = true;
  state.selected = { x:xPct, y:yPct, hit };
  state.lastElapsed = elapsed;
  state.scores[q.cat].total++;
  let pts = 0;
  if(hit){
    state.scores[q.cat].correct++;
    const speedRatio = Math.max(0, Math.min(1, elapsed/MAX_TIME));
    pts = Math.max(20, Math.round(100 - speedRatio*80));
  }
  (state.review = state.review || []).push({qi:qIndex, ok:hit, sel:null});
  state.lastPoints = pts;
  state.sessionPoints += pts;
  render();
  saveProgress();
}

async function nextQuestion(){
  if(state.idx+1 < state.order.length){
    state.idx++;
    state.answered = false;
    state.selected = null;
    render();
    saveProgress();
  } else {
    state.view = "results";
    state.isReplay = false;
    state.saveError = false;
    state.myRankLoaded = {}; state.myRank = {};
    render();
    clearProgress();
    if(state.user){
      state.savingScore = true;
      render();
      const entry = { name: state.user.name, email: state.user.email, category: state.activeCat, score: state.sessionPoints };
      const result = await saveCategoryScore(entry);
      if(result === true){
        // Première tentative réelle : Supabase vient d'enregistrer ce score
        state.bestScores = state.bestScores || {};
        state.bestScores[state.activeCat] = state.sessionPoints;
        state.lbCache[state.activeCat] = await loadCategoryLeaderboard(state.activeCat);
        state.lbCache["global"] = await loadGlobalLeaderboard();
      } else if(result === false){
        // Un score existait déjà pour ce thème dans Supabase : cette tentative est un entraînement
        state.isReplay = true;
      } else {
        // Échec de la requête (réseau, RLS...) : rien n'est verrouillé, on pourra retenter
        state.saveError = true;
      }
      state.savingScore = false;
      if(state.view==="results") render();
    }
  }
}

function resetScores(){
  CATS.forEach(c => { state.scores[c.id] = {correct:0, total:0}; });
}

async function refreshLeaderboard(key){
  state.lbLoading[key] = true;
  render();
  const list = await getLeaderboard(key);
  state.lbCache[key] = list;
  state.lbHasMore = state.lbHasMore || {};
  state.lbHasMore[key] = list.length >= LB_PAGE;
  state.lbLoading[key] = false;
  render();
}

async function ensureLeaderboard(key){
  if(state.lbCache[key] || state.lbLoading[key]) return;
  await refreshLeaderboard(key);
}

function attachHandlers(){
  if(!document.getElementById("fs-toggle")){
    var _fsb=document.createElement("button"); _fsb.id="fs-toggle"; _fsb.className="fs-toggle";
    _fsb.title=t('fsTitle'); _fsb.setAttribute("aria-label",t('fsAria'));
    _fsb.textContent = document.fullscreenElement ? "\u2922" : "\u26f6"; _fsb.onclick = toggleFullscreen;
    var _ap0=document.getElementById("app"); if(_ap0) _ap0.appendChild(_fsb);
  }
  if(!document.getElementById("lang-toggle")){
    var _lt=document.createElement("div"); _lt.id="lang-toggle"; _lt.className="lang-toggle";
    _lt.setAttribute("role","group"); _lt.setAttribute("aria-label",t('langAria'));
    _lt.innerHTML = '<button class="lang-btn" data-lang="fr" title="Français" aria-label="Français">\ud83c\uddeb\ud83c\uddf7</button>'
                  + '<button class="lang-btn" data-lang="en" title="English" aria-label="English">\ud83c\uddec\ud83c\udde7</button>';
    _lt.querySelectorAll(".lang-btn").forEach(function(b){ b.onclick=function(){ setLang(b.dataset.lang); }; });
    var _ap1=document.getElementById("app"); if(_ap1) _ap1.appendChild(_lt);
    updateLangToggle();
  }
  const gateSubmit = document.getElementById("gate-submit");
  if(gateSubmit) gateSubmit.onclick = async ()=>{
    const nameEl = document.getElementById("input-name");
    const emailEl = document.getElementById("input-email");
    const errEl = document.getElementById("gate-error");
    const name = nameEl.value.trim();
    const email = emailEl.value.trim();
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if(!name || !emailOk){
      errEl.textContent = t('gateError');
      errEl.classList.remove("hidden");
      return;
    }
    state.user = {name, email};
    state.bestScores = {};
    loadBestScores(email).then(function(){ if(state.view==="home") render(); });
    state.view = "home";
    render();
    registerUser(name, email);
    try{ var _apf=document.getElementById("app"); if(_apf && _apf.requestFullscreen) _apf.requestFullscreen(); }catch(e){}
    const saved = await loadProgress(email);
    if(saved && Array.isArray(saved.order) && saved.idx < saved.order.length){
      state.pendingResume = saved;
      if(state.view==="home") render();
    }
  };

  const resumeContinue = document.getElementById("resume-continue");
  if(resumeContinue) resumeContinue.onclick = ()=>{
    const saved = state.pendingResume;
    state.order = saved.order;
    state.optionOrder = saved.optionOrder;
    state.idx = saved.idx;
    state.scores = saved.scores;
    state.sessionPoints = saved.sessionPoints;
    state.activeCat = saved.category;
    state.answered = false;
    state.selected = null;
    state.pendingResume = null;
    state.view = "quiz";
    render();
  };

  const resumeDiscard = document.getElementById("resume-discard");
  if(resumeDiscard) resumeDiscard.onclick = ()=>{
    state.pendingResume = null;
    clearProgress();
    resetScores();
    render();
  };

  document.querySelectorAll(".map-node").forEach(btn=>{
    btn.onclick = ()=>{ resetScores(); startQuiz(btn.dataset.cat); };
  });

  document.querySelectorAll(".opt-btn").forEach(btn=>{
    btn.onclick = ()=> selectAnswer(parseInt(btn.dataset.i));
  });

  const clickZone = document.getElementById("click-zone");
  if(clickZone && !state.answered){
    clickZone.onclick = (e)=>{
      const rect = clickZone.getBoundingClientRect();
      const xPct = ((e.clientX - rect.left) / rect.width) * 100;
      const yPct = ((e.clientY - rect.top) / rect.height) * 100;
      selectClickAnswer(xPct, yPct);
    };
    // Accessibilité clavier : Entrée/Espace sélectionne la zone cible
    clickZone.onkeydown = (e)=>{
      if(e.key==="Enter" || e.key===" " || e.key==="Spacebar"){
        e.preventDefault();
        const qq = QUESTIONS[state.order[state.idx]];
        const hs = qq.hotspot;
        selectClickAnswer(hs.x + hs.w/2, hs.y + hs.h/2);
      }
    };
  }

  const nextBtn = document.getElementById("next-btn");
  if(nextBtn) nextBtn.onclick = nextQuestion;

  // Raccourcis clavier + focus (vue quiz uniquement)
  if(state.view==="quiz"){
    if(!window.__quizKbd){ window.__quizKbd = true; document.addEventListener("keydown", handleQuizKey); }
    requestAnimationFrame(function(){
      if(state.view!=="quiz") return;
      if(state.answered){ var nb=document.getElementById("next-btn"); if(nb) nb.focus(); }
      else { var qt=document.getElementById("q-text"); if(qt) qt.focus(); }
    });
  }

  const back = document.getElementById("back-home");
  if(back) back.onclick = ()=>{
    clearTimer();
    if(state.view==="quiz" && state.order.length && state.idx < state.order.length){
      state.pendingResume = {
        category: state.activeCat,
        order: state.order, optionOrder: state.optionOrder, idx: state.idx,
        scores: state.scores, sessionPoints: state.sessionPoints
      };
      saveProgress();
    }
    state.view="home"; render();
  };
  const back2 = document.getElementById("back-home-2");
  if(back2) back2.onclick = ()=>{ clearTimer(); state.view="home"; render(); };

  const retry = document.getElementById("retry-same");
  if(retry) retry.onclick = ()=>{ resetScores(); startQuiz(state.activeCat); };

  document.querySelectorAll(".lb-refresh").forEach(btn=>{
    btn.onclick = ()=> refreshLeaderboard(btn.dataset.lbkey);
  });

  document.querySelectorAll(".lb-tab").forEach(btn=>{
    btn.onclick = ()=>{ state.lbTab = btn.dataset.lbtab; state.lbSearch = ""; render(); };
  });
  const lbSearchEl = document.getElementById("lb-search");
  if(lbSearchEl){
    lbSearchEl.oninput = ()=>{ state.lbSearch = lbSearchEl.value; state._focusSearch = true; render(); };
    if(state._focusSearch){ lbSearchEl.focus(); const v=lbSearchEl.value; try{ lbSearchEl.setSelectionRange(v.length, v.length); }catch(e){} state._focusSearch = false; }
  }
  const lbMoreEl = document.getElementById("lb-loadmore");
  if(lbMoreEl) lbMoreEl.onclick = ()=> loadMoreLeaderboard(state.lbTab);
  if(state.view === "leaderboard"){
    requestAnimationFrame(function(){
      var me = document.getElementById("lb-you");
      if(me && me.scrollIntoView){ me.scrollIntoView({block:"nearest"}); }
    });
  }

  const viewAllLb = document.getElementById("view-all-leaderboards");
  if(viewAllLb) viewAllLb.onclick = ()=>{ state.view = "leaderboard"; render(); };

  if(state.view==="results"){
    const tier = getBadgeTier(state.sessionPoints);

    const shareNativeBtn = document.getElementById("share-native");
    if(shareNativeBtn) shareNativeBtn.onclick = ()=> nativeShare(tier, state.sessionPoints);

    const shareLinkedin = document.getElementById("share-linkedin");
    if(shareLinkedin) shareLinkedin.onclick = async ()=>{
      await openLinkedInShare(tier, state.sessionPoints);
      const hint = document.getElementById("share-hint-text");
      if(hint) hint.textContent = t('copiedHint');
    };

    const shareTwitter = document.getElementById("share-twitter");
    if(shareTwitter) shareTwitter.onclick = ()=> openTwitterShare(tier, state.sessionPoints);

    const shareCopy = document.getElementById("share-copy");
    if(shareCopy) shareCopy.onclick = async ()=>{
      const ok = await copyShareText(tier, state.sessionPoints);
      const original = shareCopy.textContent;
      shareCopy.textContent = ok ? t('copied') : t('copyError');
      setTimeout(()=>{ shareCopy.textContent = original; }, 1800);
    };

    const shareDownload = document.getElementById("share-download");
    if(shareDownload) shareDownload.onclick = ()=>{
      if(!LAST_SHARE_CARD_URL) return;
      const a = document.createElement("a");
      a.href = LAST_SHARE_CARD_URL;
      a.download = t('downloadName');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };
  }
}

initLang();
render();
</script>
