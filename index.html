{cat:"cowork", q:{fr:"Que permettent les \"plugins\" du Microsoft 365 App Store dans Cowork ?", en:"What do the Microsoft 365 App Store 'plugins' enable in Cowork?"}, opts:{fr:["Rien du tout, Cowork ne supporte aucun plugin","D'étendre les compétences de Cowork avec une expertise spécialisée ou des sources externes","Uniquement de changer le thème visuel et les couleurs de l'interface, sans rien ajouter d'autre","De désactiver la sécurité activée par défaut"], en:["Nothing at all; Cowork supports no plugin of any kind, whatever its origin or purpose","Extending Cowork's skills with specialized expertise or external sources","Only changing the visual theme of the interface","Disabling the security enabled by default"]}, correct:1, why:{fr:"Les plugins du M365 App Store ajoutent de nouvelles compétences à Cowork, comme une expertise spécialisée ou des connexions à des sources de données externes, y compris des plugins déployés par l'admin pour toute l'organisation.", en:"M365 App Store plugins add new skills to Cowork, such as specialized expertise or connections to external data sources, including admin-deployed plugins for the whole organization."}},
{cat:"cowork", q:{fr:"Peut-on demander à Copilot Cowork d'exécuter une tâche de façon récurrente, par exemple un briefing quotidien ?", en:"Can you ask Copilot Cowork to run a task recurrently, for example a daily briefing?"}, opts:{fr:["Oui, on peut planifier une invite récurrente automatique","Non, chaque tâche doit impérativement être relancée à la main à chacune de ses exécutions","Non, Cowork ne gère absolument aucune notion de temps ni de récurrence programmée","Oui, mais à raison d'une seule et unique exécution par mois calendaire au grand maximum"], en:["Yes, you can schedule an automatic recurring prompt","No, each task must be relaunched by hand at every run","No, Cowork handles absolutely no notion of time or scheduled recurrence","Yes, but at most a single run per calendar month"]}, correct:0, why:{fr:"On peut décrire ce que l'on veut et quand, par exemple \"envoie-moi un point quotidien chaque matin à 9h\", et Cowork configure la planification en fonction de la demande.", en:"You can describe what you want and when, for example 'send me a daily update every morning at 9am', and Cowork sets up the scheduling accordingly."}},
{cat:"cowork", q:{fr:"Quel est le statut de disponibilité de Copilot Cowork depuis juin 2026 ?", en:"What is the availability status of Copilot Cowork since June 2026?"}, opts:{fr:["Disponibilité générale (GA) mondiale, après une préversion Frontier","Toujours en préversion fermée, réservée à un tout petit nombre de clients sélectionnés","Retiré définitivement du marché à l'issue de sa période de test initiale limitée","Disponible uniquement aux États-Unis pour le moment, sans calendrier d'extension connu"], en:["Worldwide general availability (GA), after a Frontier preview","Still in closed preview, reserved for a very small number of selected customers","Permanently withdrawn from the market at the end of its limited initial test period","Available only in the United States for now, with no known rollout schedule"]}, correct:0, why:{fr:"Copilot Cowork est passé en disponibilité générale (GA) mondiale en juin 2026, après environ trois mois de préversion dans le programme Frontier.", en:"Copilot Cowork reached worldwide general availability (GA) in June 2026, after roughly three months of preview in the Frontier program."}},
{cat:"cowork", q:{fr:"Cowork hérite-t-il des protections de sécurité et de conformité de Microsoft 365 Copilot ?", en:"Does Cowork inherit the security and compliance protections of Microsoft 365 Copilot?"}, opts:{fr:["Oui : il respecte les permissions existantes et ses actions sont auditables","Non, c'est un produit totalement indépendant, sans le moindre lien avec Microsoft 365","Uniquement pour les clients disposant d'une licence Enterprise E5, et pour aucun autre","Non : la sécurité doit obligatoirement être configurée séparément et entièrement à la main"], en:["Yes: it respects existing permissions and its actions are auditable","No, it's a completely independent product, with no link whatsoever to Microsoft 365","Only for customers holding an Enterprise E5 license, and for no one else","No: security must mandatorily be configured separately and entirely by hand"]}, correct:0, why:{fr:"Copilot Cowork hérite des protections de sécurité, de confidentialité et de conformité de niveau entreprise de Microsoft 365 Copilot : les données restent dans le tenant, les permissions existantes sont respectées, et les actions sont auditables.", en:"Copilot Cowork inherits the enterprise-grade security, privacy and compliance protections of Microsoft 365 Copilot: data stays in the tenant, existing permissions are respected, and actions are auditable."}},
{cat:"cowork", q:{fr:"Depuis juin 2026, comment bascule-t-on entre le Chat classique et Cowork dans l'application Microsoft 365 Copilot ?", en:"Since June 2026, how do you switch between classic Chat and Cowork in the Microsoft 365 Copilot app?"}, opts:{fr:["Il faut désinstaller puis réinstaller l'application","Via un simple bouton bascule directement dans l'application","Uniquement en changeant de licence auprès de l'administrateur","Cowork remplace totalement le Chat, aucune bascule n'est nécessaire"], en:["You have to uninstall and then reinstall the application","Via a simple toggle button directly in the application","Only by changing your license with the administrator","Cowork fully replaces Chat, so no switch is needed"]}, correct:1, why:{fr:"Depuis juin 2026, un bouton bascule dans l'application Microsoft 365 Copilot permet de choisir facilement entre Chat (répondre) et Cowork (agir).", en:"Since June 2026, a toggle button in the Microsoft 365 Copilot app lets you easily choose between Chat (answer) and Cowork (act)."}},
{cat:"cowork", q:{fr:"Quels modèles Cowork peut-il choisir selon la tâche, depuis la mise à jour de juin 2026 ?", en:"Which models can Cowork choose depending on the task, since the June 2026 update?"}, opts:{fr:["GPT 5.5 Thinking, ou des modèles Anthropic pour le travail visuel","Un seul et unique modèle fixe imposé, sans la moindre possibilité de choix pour l'usager","Uniquement des modèles open-source communautaires, sans aucun modèle propriétaire proposé","Un modèle tiré au hasard à chaque requête"], en:["GPT 5.5 Thinking, or Anthropic models for visual work","A single fixed model imposed, with no possibility of choice for the user","Only community open-source models, with no proprietary model offered","A model picked at random each time"]}, correct:0, why:{fr:"Cowork peut choisir GPT 5.5 Thinking pour la recherche approfondie avec citations, ou des modèles Anthropic pour le travail visuel comme PowerPoint et les graphiques.", en:"Cowork can choose GPT 5.5 Thinking for deep research with citations, or Anthropic models for visual work such as PowerPoint and charts."}},
{cat:"cowork", q:{fr:"Que permet le Cost Management Dashboard du centre d'administration Microsoft 365, lié à Cowork ?", en:"What does the Cost Management Dashboard in the Microsoft 365 admin center, linked to Cowork, enable?"}, opts:{fr:["Suivre la consommation de crédits, les budgets et les dépenses","Modifier l'apparence et le design visuel de l'interface de l'application Cowork","Créer de nouveaux comptes utilisateurs et gérer leurs mots de passe respectifs","Désactiver définitivement Cowork pour l'intégralité du tenant en un unique clic"], en:["Tracking credit consumption, budgets and spending","Changing the visual look and design of the Cowork app interface","Creating new user accounts and managing their respective passwords","Permanently disabling Cowork for the entire tenant in a single click"]}, correct:0, why:{fr:"Le Cost Management Dashboard, introduit avec la disponibilité générale de Cowork, permet aux administrateurs de suivre la consommation de crédits, gérer les budgets et contrôler les dépenses.", en:"The Cost Management Dashboard, introduced with Cowork's general availability, lets administrators track credit consumption, manage budgets and control spending."}},
{cat:"cowork", q:{fr:"Depuis juin 2026, quel type de notifications Cowork envoie-t-il pour les tâches longues ?", en:"Since June 2026, what type of notifications does Cowork send for long-running tasks?"}, opts:{fr:["Des notifications push pour approbations, demandes et tâches terminées","Absolument aucune notification : l'utilisateur doit tout vérifier entièrement à la main","Un simple email récapitulatif expédié une seule fois par semaine, et rien de plus","Un SMS envoyé uniquement sur demande explicite et répétée de la part de l'utilisateur"], en:["Push notifications for approvals, requests and completed tasks","Absolutely no notification: the user must check everything entirely by hand","A simple summary email sent just once a week, and nothing more","An SMS sent only on the user's explicit and repeated request"]}, correct:0, why:{fr:"Cowork envoie désormais des notifications push pour les tâches longues, incluant les approbations, les demandes d'informations et les achèvements de tâches.", en:"Cowork now sends push notifications for long-running tasks, including approvals, information requests and task completions."}},
{cat:"cowork", q:{fr:"Que peut désormais faire Microsoft 365 Copilot grâce à Work IQ concernant Power BI, depuis juin 2026 (Frontier) ?", en:"What can Microsoft 365 Copilot now do thanks to Work IQ regarding Power BI, since June 2026 (Frontier)?"}, opts:{fr:["Raisonner sur les données Power BI en langage naturel","Créer automatiquement des visuels Power BI complets sans disposer de la moindre donnée","Supprimer d'office les rapports Power BI que le système juge obsolètes ou inutilisés","Remplacer intégralement Power BI par Cowork dans l'ensemble de l'organisation cliente"], en:["Reason over Power BI data in natural language","Automatically create full Power BI visuals without having any data","Delete outright the Power BI reports the system deems obsolete or unused","Fully replace Power BI with Cowork across the whole client organization"]}, correct:0, why:{fr:"Avec Work IQ, Copilot peut désormais raisonner sur les données d'entreprise Power BI et répondre à des questions en langage naturel directement à partir des rapports et modèles sémantiques.", en:"With Work IQ, Copilot can now reason over Power BI enterprise data and answer natural-language questions directly from the reports and semantic models."}},
{cat:"cowork", q:{fr:"Que permettent les nouvelles expériences agentiques de Copilot dans Outlook pour la boîte de réception ?", en:"What do Copilot's new agentic experiences in Outlook enable for the inbox?"}, opts:{fr:["Agir sur la planification, les relances et la boîte de réception","Trier manuellement chacun des emails un par un, sans aucune forme d'automatisation réelle","Supprimer automatiquement tous les emails datant de plus de trente jours dans la boîte","Bloquer purement et simplement l'envoi de tout nouvel email depuis le compte concerné"], en:["Acting on scheduling, follow-ups and the inbox","Manually sorting each email one by one, without any real automation","Automatically deleting all emails older than thirty days in the inbox","Purely and simply blocking the sending of any new email from the account"]}, correct:0, why:{fr:"Les nouvelles expériences agentiques de Copilot dans Outlook permettent à l'IA de prendre des actions concrètes sur la planification, les relances et la gestion de la boîte de réception.", en:"Copilot's new agentic experiences in Outlook let the AI take concrete actions on scheduling, follow-ups and inbox management."}},
{cat:"cowork", type:"click", q:{fr:"Sur cette interface Microsoft 365 Copilot, cliquez sur l'onglet permettant de basculer vers Cowork.", en:"On this Microsoft 365 Copilot interface, click the tab that lets you switch to Cowork."}, image:SCREENSHOT_1, hotspot:{x:6.78,y:6.94,w:6.26,h:3.7}, why:{fr:"L'onglet \"Cowork\", à côté de \"Conversation\", permet de basculer entre le chat classique (répondre à des questions) et Cowork (exécuter des tâches de bout en bout).", en:"The 'Cowork' tab, next to 'Chat', lets you switch between the classic chat (answering questions) and Cowork (running tasks end to end)."}},
{cat:"cowork", q:{fr:"Où l'utilisateur retrouve-t-il l'avancement et l'historique des tâches confiées à Cowork ?", en:"Where does the user find the progress and history of the tasks handed to Cowork?"}, opts:{fr:["Dans une vue dédiée listant les tâches en cours et terminées","Nulle part : une fois lancée, une tâche devient totalement invisible et intraçable","Uniquement dans un email de rapport envoyé une seule fois par mois calendaire","Seulement en contactant le support technique de Microsoft pour chaque tâche"], en:["In a dedicated view listing in-progress and completed tasks","Nowhere: once launched, a task becomes completely invisible and untraceable","Only in a report email sent just once per calendar month","Only by contacting Microsoft technical support for each task"]}, correct:0, why:{fr:"Cowork propose une vue des tâches (en cours et terminées) : l'utilisateur y suit l'avancement, répond aux demandes de validation et retrouve l'historique de ce qui a été fait.", en:"Cowork offers a tasks view (in-progress and completed): the user tracks progress there, responds to approval requests and finds the history of what has been done."}},
{cat:"cowork", type:"click", q:{fr:"En Cowork, on décrit la tâche à confier à Copilot. Cliquez sur la zone où saisir cette demande.", en:"In Cowork, you describe the task to hand to Copilot. Click the area where you enter that request."}, image:SCREENSHOT_1, hotspot:{x:33.5,y:53,w:44,h:7}, why:{fr:"Tout part de la zone « Message Copilot » : en Cowork, on y décrit une tâche que Copilot exécute ensuite de bout en bout (envoyer des e-mails, créer un document, planifier une réunion…), avec votre validation.", en:"Everything starts from the 'Message Copilot' area: in Cowork you describe a task there, which Copilot then runs end to end (sending emails, creating a document, scheduling a meeting…), with your validation."}},
{cat:"cowork", type:"click", q:{fr:"Cliquez sur le lanceur d'applications (les points en haut à gauche) qui donne accès aux autres applications Microsoft 365.", en:"Click the app launcher (the dots at the top left) that gives access to the other Microsoft 365 apps."}, image:SCREENSHOT_1, hotspot:{x:8.8,y:1.4,w:3.2,h:3.4}, why:{fr:"Copilot et Cowork agissent à travers tout l'écosystème Microsoft 365 : le lanceur d'applications ouvre les autres apps (Word, Outlook, Teams…) où ce travail se prolonge.", en:"Copilot and Cowork act across the whole Microsoft 365 ecosystem: the app launcher opens the other apps (Word, Outlook, Teams…) where that work continues."}},
{cat:"studio", q:{fr:"À quoi sert principalement Microsoft Copilot Studio ?", en:"What is Microsoft Copilot Studio primarily for?"}, opts:{fr:["Créer, personnaliser et gérer des agents IA sur mesure","Uniquement à modifier les paramètres de sécurité du système d'exploitation Windows","Exclusivement à générer des présentations PowerPoint à partir de simples consignes","À remplacer entièrement Microsoft Teams ainsi qu'Outlook au sein de l'organisation"], en:["Creating, customizing and managing tailor-made AI agents","Only changing the security settings of the Windows operating system","Generating PowerPoint presentations","Fully replacing Microsoft Teams as well as Outlook within the organization"]}, correct:0, why:{fr:"Copilot Studio est la plateforme low-code permettant de créer, personnaliser, déployer et gérer des agents IA sur mesure, allant au-delà de l'assistant générique M365 Copilot.", en:"Copilot Studio is the low-code platform for creating, customizing, deploying and managing tailor-made AI agents, going beyond the generic M365 Copilot assistant."}},
{cat:"studio", q:{fr:"Que permettent les \"agents utilisant l'ordinateur\" (computer-using agents), devenus généralement disponibles en mai 2026 ?", en:"What do 'computer-using agents', which became generally available in May 2026, enable?"}, opts:{fr:["Uniquement de surveiller l'activité de l'utilisateur en continu","D'interagir directement avec des sites web et apps de bureau via l'UI","De remplacer physiquement le clavier et la souris de l'utilisateur, entièrement à sa place","Rien de nouveau par rapport aux agents classiques existants"], en:["Only monitoring the user's activity continuously","Interacting directly with websites and desktop apps via the UI","Physically replacing the user's keyboard and mouse","Nothing new compared with the existing classic agents already available for years"]}, correct:1, why:{fr:"Ces agents interagissent directement avec l'interface (UI) de sites web ou d'applications de bureau, ce qui permet d'automatiser des processus reposant sur des systèmes legacy dépourvus d'API.", en:"These agents interact directly with the UI of websites or desktop applications, which makes it possible to automate processes built on legacy systems that lack APIs."}},
{cat:"studio", q:{fr:"Qu'est-ce qu'Agent 365, devenu généralement disponible le 1er mai 2026 ?", en:"What is Agent 365, which became generally available on May 1, 2026?"}, opts:{fr:["Le plan de contrôle centralisé pour gouverner et sécuriser les agents IA","Un tout nouvel abonnement Office spécialement destiné au grand public et aux familles","Une simple application de messagerie interne utilisée par les seules équipes Microsoft","Un outil de facturation Azure strictement réservé aux administrateurs du tenant client"], en:["The centralized control plane to govern and secure the organization's AI agents","A brand-new Office subscription specifically aimed at consumers and families","A simple internal messaging app used only by Microsoft's own teams","An Azure billing tool strictly reserved for the client tenant's administrators and finance teams"]}, correct:0, why:{fr:"Agent 365 est le plan de contrôle central qui donne une visibilité unifiée sur l'inventaire, les permissions, le comportement et l'activité des agents, y compris ceux construits dans Copilot Studio.", en:"Agent 365 is the central control plane that provides unified visibility into the inventory, permissions, behavior and activity of agents, including those built in Copilot Studio."}},
{cat:"studio", q:{fr:"Quels modèles peut-on choisir pour un agent construit dans Copilot Studio ?", en:"Which models can you choose for an agent built in Copilot Studio?"}, opts:{fr:["Plusieurs modèles selon les besoins, dont GPT, Claude et Mistral","Un seul et unique modèle imposé d'office, sans la moindre possibilité de choix offerte","Uniquement des modèles Microsoft propriétaires et entièrement fermés, sans alternative","Aucun modèle : les agents se contentent d'appliquer des règles fixes définies à l'avance"], en:["Several models depending on needs, including GPT, Claude and Mistral","A single model imposed by default, with no possibility of choice offered","Only proprietary, entirely closed Microsoft models, with no alternative","No model: agents merely apply fixed rules defined in advance"]}, correct:0, why:{fr:"Copilot Studio permet de choisir le modèle le plus adapté à chaque agent pour optimiser profondeur de raisonnement, qualité, latence et coût, avec des modèles GPT, Claude, Mistral notamment.", en:"Copilot Studio lets you choose the most suitable model for each agent to optimize reasoning depth, quality, latency and cost, with GPT, Claude and Mistral models notably."}},
{cat:"studio", q:{fr:"Sur quelles connaissances peut-on ancrer un agent créé dans Copilot Studio ?", en:"What knowledge can an agent built in Copilot Studio be grounded on?"}, opts:{fr:["Vos propres sources : SharePoint, fichiers, sites web, Dataverse","Uniquement les connaissances générales publiques du modèle, sans aucune source ajoutée","Seulement une liste de questions/réponses saisies manuellement une par une","Rien : aucune donnée d'entreprise possible"], en:["Your own sources: SharePoint, files, websites, Dataverse","Only the model's general public knowledge, with no added source whatsoever","Only a list of questions and answers entered manually one by one","Nothing: no enterprise data possible"]}, correct:0, why:{fr:"Un agent Copilot Studio peut être ancré sur vos propres connaissances (sites SharePoint, fichiers, pages web publiques, Dataverse…), ce qui lui permet de répondre à partir des données de l'organisation.", en:"A Copilot Studio agent can be grounded on your own knowledge (SharePoint sites, files, public web pages, Dataverse…), letting it answer from the organization's data."}},
{cat:"studio", q:{fr:"À quoi servent les \"évaluations d'agents\" (agent evaluations), désormais généralement disponibles ?", en:"What are 'agent evaluations', now generally available, for?"}, opts:{fr:["À facturer les clients selon le nombre d'agents créés","À valider la performance d'un agent via des jeux de test multi-tours","À supprimer automatiquement les agents peu utilisés","À chiffrer systématiquement l'intégralité des conversations des agents concernés"], en:["Billing customers based on the total number of agents created in the tenant each month","Validating an agent's performance via multi-turn test sets","Automatically deleting rarely used agents","Systematically encrypting agents' conversations"]}, correct:1, why:{fr:"Les évaluations d'agents permettent de valider la performance à l'aide de jeux de test personnalisables et de simuler des conversations multi-tours pour identifier forces et axes d'amélioration.", en:"Agent evaluations let you validate performance using customizable test sets and simulate multi-turn conversations to identify strengths and areas for improvement."}},
{cat:"studio", q:{fr:"Copilot Studio est l'évolution rebrandée de quelle plateforme historique de Microsoft ?", en:"Copilot Studio is the rebranded evolution of which historical Microsoft platform?"}, opts:{fr:["Power Virtual Agents (PVA), qui a été rebaptisé fin 2023","Power BI, l'outil d'analyse et de visualisation de données proposé par Microsoft","Dynamics 365 Sales, la solution de gestion de la relation client (CRM) de Microsoft","Azure DevOps, la plateforme de développement et de déploiement logiciel de Microsoft"], en:["Power Virtual Agents (PVA), which was renamed at the end of 2023","Power BI, Microsoft's data analysis and visualization tool","Dynamics 365 Sales, Microsoft's customer relationship management (CRM) solution","Azure DevOps, Microsoft's software development and deployment platform"]}, correct:0, why:{fr:"Microsoft a rebaptisé Power Virtual Agents en Copilot Studio fin 2023 ; les flux de type PVA fonctionnent toujours mais la plateforme stratégique porte désormais ce nouveau nom.", en:"Microsoft renamed Power Virtual Agents to Copilot Studio at the end of 2023; PVA-style flows still work but the strategic platform now carries this new name."}},
{cat:"studio", q:{fr:"Quel est approximativement le modèle de tarification de base de Copilot Studio ?", en:"What is, approximately, Copilot Studio's base pricing model?"}, opts:{fr:["Un tarif mensuel par tenant, plus une consommation de crédits","Totalement gratuit et parfaitement illimité pour l'ensemble des tenants, sans exception","Facturé uniquement selon le nombre total d'utilisateurs finaux de l'agent déployé","Facturé une seule fois au moment de l'achat, sans le moindre abonnement récurrent ensuite"], en:["A monthly per-tenant rate, plus credit consumption","Completely free and perfectly unlimited for all tenants, without exception","Billed only by the total number of end users of the deployed agent","Billed once at purchase, with no recurring subscription afterward"]}, correct:0, why:{fr:"Copilot Studio comporte un tarif de base mensuel par tenant (autour de 200$/mois) complété par une consommation de crédits Copilot, ou peut être inclus dans des offres comme le E7 Frontier Suite.", en:"Copilot Studio has a monthly per-tenant base rate (around $200/month) complemented by Copilot credit consumption, or it can be included in offers such as the E7 Frontier Suite."}},
{cat:"studio", q:{fr:"Que permettent les \"systèmes multi-agents\", généralement disponibles dans Copilot Studio ?", en:"What do 'multi-agent systems', generally available in Copilot Studio, enable?"}, opts:{fr:["Un seul agent ne peut jamais interagir avec un autre","Des agents peuvent collaborer, se déléguer des tâches et partager le contexte","Uniquement d'exécuter plusieurs agents en parallèle, sans aucune communication entre eux","De fusionner tous les agents en un seul bloc de code"], en:["A single agent can never interact with another","Agents can collaborate, delegate tasks and share context","Only running agents in parallel, without any communication between them at all","Merging all agents into a single block of code"]}, correct:1, why:{fr:"Work IQ prend en charge la communication agent-à-agent, permettant aux agents de collaborer, de se déléguer des tâches et de maintenir un contexte partagé entre workflows.", en:"Work IQ supports agent-to-agent communication, letting agents collaborate, delegate tasks and maintain shared context across workflows."}},
{cat:"studio", q:{fr:"Que permet la nouvelle expérience de workflows dans Copilot Studio, disponible en environnements de préversion anticipée ?", en:"What does the new workflows experience in Copilot Studio, available in early-preview environments, enable?"}, opts:{fr:["Concevoir des workflows de bout en bout sur un canevas visuel unifié","Supprimer automatiquement l'intégralité des workflows déjà existants dans l'environnement","Limiter chaque workflow à une seule et unique étape, sans possibilité d'en ajouter d'autres","Remplacer entièrement les agents conversationnels par de simples formulaires statiques"], en:["Designing end-to-end workflows on a unified visual canvas","Automatically deleting all existing workflows in the environment","Limiting each workflow to a single step, with no way to add others","Fully replacing conversational agents with plain static forms"]}, correct:0, why:{fr:"La nouvelle expérience de workflows introduit un canevas visuel unifié permettant de concevoir des workflows de bout en bout, combinant actions, décisions et étapes IA en un seul endroit.", en:"The new workflows experience introduces a unified visual canvas to design end-to-end workflows, combining actions, decisions and AI steps in one place."}},
{cat:"studio", q:{fr:"Que permet la communication agent-à-agent (A2A), généralement disponible dans Copilot Studio ?", en:"What does agent-to-agent (A2A) communication, generally available in Copilot Studio, enable?"}, opts:{fr:["Aux agents d'échanger des informations et de se déléguer des tâches","De bloquer toute communication entre les agents, officiellement pour des motifs de sécurité","De fusionner automatiquement l'ensemble des agents existants en un seul et unique agent","De limiter strictement chaque agent à une seule tâche unique, et cela pour toute sa vie"], en:["Agents to exchange information and delegate tasks to each other","Blocking any communication between agents, officially for security reasons","Automatically merging all existing agents into one single agent","Strictly limiting each agent to a single task, for its entire life"]}, correct:0, why:{fr:"La communication A2A, généralement disponible, permet aux agents d'échanger des informations, de se déléguer des tâches et de mieux collaborer entre systèmes et workflows.", en:"A2A communication, generally available, lets agents exchange information, delegate tasks to each other and collaborate better across systems and workflows."}},
{cat:"studio", type:"click", q:{fr:"Sur l'accueil de Copilot Studio, cliquez sur la carte permettant de créer un Assistant (agent qui répond et agit).", en:"On the Copilot Studio home, click the card that creates an Assistant (an agent that answers and takes action)."}, image:SS_STUDIO_HOME, hotspot:{x:27.8,y:29.3,w:29.8,h:28.7}, why:{fr:"La carte « Assistant » crée un agent conversationnel capable de répondre aux questions et de prendre des mesures ; l'autre carte, « Workflow », automatise des processus en plusieurs étapes.", en:"The 'Assistant' card creates a conversational agent that can answer questions and take action; the other card, 'Workflow', automates multi-step processes."}},
{cat:"studio", q:{fr:"Que permet la fonctionnalité « apps in agents » (applications dans les agents), généralement disponible ?", en:"What does the 'apps in agents' feature, generally available, enable?"}, opts:{fr:["Faire surgir des expériences d'application interactives dans Copilot Chat","Bloquer purement et simplement l'accès à toute application tierce depuis l'environnement","Transformer chacun des agents existants en une application mobile totalement autonome","Supprimer définitivement tout besoin de recourir à Copilot Chat au sein de l'organisation"], en:["Agents to surface interactive app experiences inside Copilot Chat","Blocking access outright to any third-party application from the environment","Turning each existing agent into a fully autonomous mobile application","Permanently removing any need to use Copilot Chat within the organization"]}, correct:0, why:{fr:"Les agents construits dans Copilot Studio peuvent désormais faire surgir des expériences d'application riches et interactives directement dans Copilot Chat, permettant de revoir des données ou approuver des demandes sans changer d'outil.", en:"Agents built in Copilot Studio can now surface rich, interactive app experiences directly inside Copilot Chat, letting you review data or approve requests without switching tools."}},
{cat:"studio", type:"click", q:{fr:"Cliquez sur la carte permettant d'automatiser un processus en plusieurs étapes, avec déclencheurs, actions et étapes IA.", en:"Click the card that automates a multi-step process, with triggers, actions and AI steps."}, image:SS_STUDIO_HOME, hotspot:{x:59,y:29.3,w:29.8,h:28.7}, why:{fr:"La carte « Workflow » automatise des processus multi-étapes déclenchés par des événements, en combinant actions et étapes d'IA — à distinguer de l'agent conversationnel « Assistant ».", en:"The 'Workflow' card automates event-triggered multi-step processes, combining actions and AI steps — distinct from the conversational 'Assistant' agent."}},
{cat:"studio", q:{fr:"Une fois construit, sur quels canaux peut-on publier un agent Copilot Studio ?", en:"Once built, to which channels can a Copilot Studio agent be published?"}, opts:{fr:["Teams, un site web, ou d'autres canaux de messagerie","Uniquement à l'intérieur de l'éditeur Copilot Studio, sans aucune publication possible","Seulement par l'envoi manuel d'un fichier exécutable à chaque utilisateur final concerné","Exclusivement sur une borne physique installée dans les locaux de l'entreprise cliente"], en:["Teams, a website, or other messaging channels","Only inside the Copilot Studio editor, with no publishing possible at all","Only by manually sending an executable file to each end user concerned","Exclusively on a physical kiosk installed at the client company's premises"]}, correct:0, why:{fr:"Un agent construit dans Copilot Studio se publie sur plusieurs canaux : Microsoft Teams, un site web, ou d'autres canaux de messagerie, pour être mis à disposition des utilisateurs.", en:"An agent built in Copilot Studio can be published to several channels: Microsoft Teams, a website, or other messaging channels, to make it available to users."}},
{cat:"studio", type:"click", q:{fr:"Dans le menu de gauche, cliquez sur l'entrée qui regroupe vos agents.", en:"In the left menu, click the entry that groups your agents."}, image:SS_STUDIO_HOME, hotspot:{x:1,y:16.5,w:14.6,h:4.7}, why:{fr:"L'entrée « Agents » du panneau de navigation regroupe les agents créés dans Copilot Studio, pour les retrouver, les modifier et les gérer.", en:"The 'Agents' entry in the navigation panel groups the agents built in Copilot Studio, so you can find, edit and manage them."}},
{cat:"studio", q:{fr:"Qu'est-ce que Microsoft Foundry, en lien avec la construction d'agents de production ?", en:"What is Microsoft Foundry, in relation to building production agents?"}, opts:{fr:["Une plateforme Azure : portail, exécution d'agents et catalogue de modèles","Un simple éditeur de texte, uniquement destiné à écrire et relire du code source","Un outil strictement réservé aux équipes du support technique de Microsoft en interne","Une messagerie interne à Microsoft, sans aucun lien avec la construction d'agents IA"], en:["An Azure platform: portal, agent runtime and model catalog","A simple text editor, meant only for writing and reviewing source code","A tool strictly reserved for Microsoft's internal technical support teams","An internal Microsoft messaging app, with no link to building AI agents"]}, correct:0, why:{fr:"Microsoft Foundry est la plateforme hébergée sur Azure pour construire des agents IA de qualité production, combinant un portail, un moteur d'exécution d'agents et un catalogue de modèles.", en:"Microsoft Foundry is the Azure-hosted platform for building production-quality AI agents, combining a portal, an agent runtime and a model catalog."}},
{cat:"studio", type:"click", q:{fr:"Dans l'éditeur d'agent, cliquez sur le sélecteur permettant de changer le modèle IA de l'agent (ici GPT-5.6 Reasoning).", en:"In the agent editor, click the selector that changes the agent's AI model (here GPT-5.6 Reasoning)."}, image:SS_STUDIO_AGENT, hotspot:{x:85.9,y:11.5,w:12.5,h:3.6}, why:{fr:"Le sélecteur « Model » permet de choisir le modèle IA de l'agent (ici GPT-5.6 Reasoning) : Copilot Studio propose plusieurs modèles selon la profondeur de raisonnement, la qualité, la latence et le coût recherchés.", en:"The 'Model' selector chooses the agent's AI model (here GPT-5.6 Reasoning): Copilot Studio offers several models depending on the desired reasoning depth, quality, latency and cost."}},
{cat:"studio", type:"click", q:{fr:"Cliquez sur la section permettant d'ancrer l'agent sur des connaissances de confiance (SharePoint, fichiers, sites web…).", en:"Click the section that grounds the agent on trusted knowledge (SharePoint, files, websites…)."}, image:SS_STUDIO_AGENT, hotspot:{x:74.4,y:41.5,w:24,h:6}, why:{fr:"La section « Knowledge » fournit à l'agent un contexte de confiance pour guider ses réponses : on y ajoute des sources comme SharePoint, des fichiers ou des sites web.", en:"The 'Knowledge' section provides the agent with trusted context to guide its answers: you add sources such as SharePoint, files or websites."}},
{cat:"studio", type:"click", q:{fr:"Une fois l'agent prêt, cliquez sur le bouton permettant de le publier.", en:"Once the agent is ready, click the button that publishes it."}, image:SS_STUDIO_AGENT, hotspot:{x:93.4,y:2.2,w:5,h:3.6}, why:{fr:"Le bouton « Publish » publie l'agent pour le rendre disponible sur ses canaux (Teams, site web…). Avant cela, l'onglet « Preview » permet de le tester.", en:"The 'Publish' button publishes the agent to make it available on its channels (Teams, a website…). Before that, the 'Preview' tab lets you test it."}},
{cat:"secu", q:{fr:"Sur quel principe repose l'accès de Copilot aux données de l'organisation ?", en:"On what principle does Copilot's access to the organization's data rely?"}, opts:{fr:["Copilot ne présente que les données déjà autorisées pour l'utilisateur","Copilot accède à l'intégralité des données du tenant, absolument sans aucune restriction","Copilot réclame une autorisation manuelle explicite à chacune des requêtes qui lui sont envoyées","L'accès dépend seulement du poste occupé"], en:["Copilot only surfaces the data the user is already allowed to see","Copilot accesses the entirety of the tenant's data, with absolutely no restriction","Copilot demands explicit manual authorization for each request sent to it","Access depends only on the person's role"]}, correct:0, why:{fr:"Le modèle de permissions du tenant garantit que Copilot ne présente que les données que chaque utilisateur peut déjà consulter, via les mêmes contrôles d'accès que les autres services Microsoft 365.", en:"The tenant's permission model ensures Copilot only surfaces data each user can already view, via the same access controls as other Microsoft 365 services."}},
{cat:"secu", q:{fr:"Les prompts et réponses des utilisateurs sont-ils utilisés pour entraîner les modèles fondamentaux (foundation LLMs) ?", en:"Are users' prompts and responses used to train the foundation LLMs?"}, opts:{fr:["Non, ils ne servent pas à entraîner les foundation LLMs","Oui, systématiquement et en continu, dans le but d'améliorer sans cesse les modèles utilisés","Oui, mais uniquement pour les clients ayant souscrit à l'offre gratuite de Copilot Chat","Oui, uniquement pendant les trente tout premiers jours suivant la création du compte utilisateur"], en:["No, they are not used to train the foundation LLMs","Yes, systematically and continuously, in order to keep improving the models used","Yes, but only for customers who subscribed to the free Copilot Chat offer","Yes, only during the very first thirty days after the account is created"]}, correct:0, why:{fr:"Microsoft affirme explicitement que les prompts, réponses et données accédées via le Graph ne servent pas à entraîner les foundation LLMs utilisés par Copilot.", en:"Microsoft explicitly states that prompts, responses and data accessed via the Graph are not used to train the foundation LLMs used by Copilot."}},
{cat:"secu", q:{fr:"Pour obtenir une réponse utile de Copilot, que vaut-il mieux préciser dans sa demande ?", en:"To get a useful answer from Copilot, what is best to specify in your request?"}, opts:{fr:["Le contexte, l'objectif et le format de réponse attendu","Uniquement un mot-clé isolé, sans jamais donner le moindre élément de contexte","Le plus de fautes de frappe possible pour tester la robustesse du modèle","Rien : rester le plus vague possible"], en:["The context, the goal and the expected response format","Only an isolated keyword, without ever giving the slightest piece of context","As many typos as possible in order to test the model's robustness","Nothing: stay as vague as possible"]}, correct:0, why:{fr:"Un bon prompt précise le contexte, l'objectif et le format souhaité (ton, longueur, structure) : plus la consigne est claire, plus la réponse est pertinente.", en:"A good prompt specifies the context, the goal and the desired format (tone, length, structure): the clearer the instruction, the more relevant the answer."}},
{cat:"secu", q:{fr:"Que fait la fonctionnalité de prévention de perte de données (DLP) pour les prompts Copilot lorsqu'un type d'information sensible est détecté ?", en:"What does data loss prevention (DLP) do for Copilot prompts when a sensitive information type is detected?"}, opts:{fr:["Elle bloque le traitement du prompt et empêche tout ancrage","Elle laisse passer le prompt tel quel, mais alerte l'administrateur seulement après coup","Elle supprime définitivement et sans préavis le compte de l'utilisateur jugé fautif","Elle chiffre automatiquement la réponse générée par Copilot avant de l'afficher à l'écran"], en:["It blocks the prompt's processing and prevents any grounding","It lets the prompt through as is, but alerts the administrator only afterward","It permanently and without notice deletes the account of the user deemed at fault","It automatically encrypts the response generated by Copilot before displaying it"]}, correct:0, why:{fr:"La DLP Purview pour les prompts Copilot scanne le texte en temps réel : si un type d'information sensible est détecté, le traitement est bloqué, aucun ancrage Graph ou web n'a lieu, et l'utilisateur reçoit un message clair.", en:"Purview DLP for Copilot prompts scans the text in real time: if a sensitive information type is detected, processing is blocked, no Graph or web grounding occurs, and the user receives a clear message."}},
{cat:"secu", q:{fr:"Pourquoi le \"sur-partage\" (oversharing) préexistant dans SharePoint/OneDrive constitue-t-il un risque particulier avec Copilot ?", en:"Why does pre-existing 'oversharing' in SharePoint/OneDrive represent a particular risk with Copilot?"}, opts:{fr:["Copilot peut retrouver des fichiers accessibles mais jamais ouverts","Ce n'est pas un risque du tout : Copilot ignore par défaut tous les fichiers jamais consultés","Cela ne concerne que les fichiers stockés en dehors du tenant Microsoft de l'organisation","Cela ne concerne que les emails échangés, et jamais les fichiers partagés dans SharePoint"], en:["Copilot can surface files that are accessible but never opened","It's not a risk at all: Copilot ignores by default all files never viewed","It only concerns files stored outside the organization's Microsoft tenant","It only concerns exchanged emails, and never files shared in SharePoint"]}, correct:0, why:{fr:"Copilot s'appuie sur le Microsoft Graph, qui peut faire remonter tout contenu auquel l'identité de l'utilisateur a techniquement accès, même des fichiers jamais ouverts, d'où l'importance de remédier au sur-partage avant le déploiement.", en:"Copilot relies on the Microsoft Graph, which can surface any content the user's identity technically has access to, even files never opened, hence the importance of remediating oversharing before deployment."}},
{cat:"secu", q:{fr:"La première réponse de Copilot ne convient pas tout à fait. Quelle est la bonne pratique ?", en:"Copilot's first answer isn't quite right. What's the good practice?"}, opts:{fr:["Affiner la réponse en demandant des ajustements successifs","Abandonner définitivement, car Copilot ne peut jamais corriger une réponse déjà donnée","Recommencer depuis un nouveau compte à chaque tentative infructueuse de reformulation","Copier la réponse telle quelle sans jamais la relire ni la retravailler"], en:["Refine the answer by asking for successive adjustments","Give up for good, since Copilot can never correct an answer it has already given","Start over from a new account at every unsuccessful rephrasing attempt","Copy the answer as is, without ever rereading or reworking it"]}, correct:0, why:{fr:"Copilot est itératif : on précise, on demande « plus court », « plus formel » ou « ajoute un exemple »… jusqu'au résultat voulu, en gardant le fil de la conversation.", en:"Copilot is iterative: you clarify, ask for 'shorter', 'more formal' or 'add an example'… until you get the result you want, keeping the conversation thread."}},
{cat:"secu", q:{fr:"Qu'est-ce qu'une attaque par injection de prompt dans le contexte de Copilot ?", en:"What is a prompt injection attack in the context of Copilot?"}, opts:{fr:["Des instructions malveillantes cachées qui détournent Copilot","Une simple erreur de frappe commise par mégarde par l'utilisateur au moment de sa saisie","Une mise à jour parfaitement officielle, publiée et signée par les équipes de Microsoft","Un banal bug d'affichage, totalement sans conséquence sur la sécurité des données traitées"], en:["Hidden malicious instructions that hijack Copilot","A simple typo made by mistake by the user while typing","A perfectly official update, published and signed by Microsoft's teams","A trivial display bug, entirely harmless to the security of the data processed"]}, correct:0, why:{fr:"Une injection de prompt consiste à cacher des instructions malveillantes dans un document, un email ou une page web pour détourner le comportement de Copilot, par exemple pour exfiltrer des données ou produire un contenu nuisible.", en:"A prompt injection consists of hiding malicious instructions in a document, an email or a web page to hijack Copilot's behavior, for example to exfiltrate data or produce harmful content."}},
{cat:"secu", q:{fr:"Face à un chiffre ou une citation fournie par Copilot dans un document important, que faire ?", en:"Faced with a figure or a quote provided by Copilot in an important document, what should you do?"}, opts:{fr:["Vérifier la source de l'information avant de l'utiliser","La diffuser immédiatement puisque l'IA ne se trompe jamais sur les chiffres","La supprimer systématiquement par principe, même lorsqu'elle est correcte","La recopier sans relecture afin de gagner le maximum de temps possible"], en:["Verify the source of the information before using it","Share it immediately since AI never makes mistakes on figures","Delete it systematically on principle, even when it is correct","Copy it without rereading in order to save the maximum amount of time"]}, correct:0, why:{fr:"L'IA générative peut « halluciner » : on vérifie les faits, chiffres et citations importantes, en s'appuyant sur les sources fournies, avant de les réutiliser.", en:"Generative AI can 'hallucinate': verify important facts, figures and quotes, using the sources provided, before reusing them."}},
{cat:"secu", q:{fr:"Un utilisateur peut-il consulter et supprimer l'historique de ses propres interactions avec Copilot ?", en:"Can a user view and delete the history of their own interactions with Copilot?"}, opts:{fr:["Oui, via le portail Mon compte, il peut supprimer son historique","Non, seul un administrateur global du tenant est réellement en mesure de le faire à sa place","Non, cet historique d'interactions n'existe tout simplement pas d'un point de vue technique","Oui, mais à raison d'une seule fois par année calendaire au grand maximum, et pas davantage"], en:["Yes, via the My Account portal, they can delete their history","No, only a tenant global administrator is really able to do it on their behalf","No, this interaction history simply does not exist from a technical standpoint","Yes, but at most once per calendar year, and no more than that"]}, correct:0, why:{fr:"Les utilisateurs peuvent supprimer leur historique d'activité Copilot (prompts et réponses) depuis le portail Mon compte ; les administrateurs disposent en parallèle d'outils Purview pour l'audit et la conformité.", en:"Users can delete their Copilot activity history (prompts and responses) from the My Account portal; administrators separately have Purview tools for audit and compliance."}},
{cat:"secu", q:{fr:"Que garantit la limite EU Data Boundary pour les utilisateurs situés dans l'Union européenne ?", en:"What does the EU Data Boundary guarantee for users located in the European Union?"}, opts:{fr:["Le trafic des utilisateurs de l'UE reste dans la limite de données de l'UE","Aucune garantie particulière n'est offerte : les données circulent librement partout dans le monde","Les données des utilisateurs de l'UE sont systématiquement transférées et traitées aux États-Unis","Cette limite s'applique uniquement aux fichiers stockés, et jamais aux prompts saisis par l'usager"], en:["EU users' traffic stays within the EU data boundary","No particular guarantee is offered: data flows freely everywhere in the world","EU users' data is systematically transferred to and processed in the United States","This boundary applies only to stored files, and never to the prompts the user types"]}, correct:0, why:{fr:"Pour les utilisateurs de l'UE, des garanties supplémentaires assurent que leur trafic reste à l'intérieur de la limite de données de l'UE, tandis que le trafic mondial peut être acheminé vers d'autres régions selon la capacité disponible.", en:"For EU users, additional safeguards ensure their traffic stays within the EU data boundary, while global traffic may be routed to other regions depending on available capacity."}},
{cat:"secu", q:{fr:"Pour une tâche multi-étapes à exécuter à votre place (créer un doc, envoyer un mail…), quelle surface Copilot est la plus adaptée ?", en:"For a multi-step task to run on your behalf (create a doc, send an email…), which Copilot surface fits best?"}, opts:{fr:["Copilot Cowork","Le simple chat de questions-réponses, qui n'agit jamais dans les applications","Un tableur Excel vierge rempli entièrement à la main sans aucune assistance","Une recherche web classique effectuée dans le navigateur, sans Copilot"], en:["Copilot Cowork","The plain question-and-answer chat, which never acts inside the applications","A blank Excel spreadsheet filled in entirely by hand with no assistance at all","A classic web search performed in the browser, without Copilot"]}, correct:0, why:{fr:"Le chat répond, mais pour enchaîner des actions concrètes de bout en bout (documents, emails, réunions), Copilot Cowork est conçu pour agir à votre place, avec votre validation.", en:"The chat answers, but to chain concrete end-to-end actions (documents, emails, meetings), Copilot Cowork is built to act on your behalf, with your validation."}},
{cat:"secu", q:{fr:"Bonne pratique concernant les données très sensibles quand on utilise une IA grand public non gérée ?", en:"Good practice regarding highly sensitive data when using an unmanaged consumer AI?"}, opts:{fr:["Éviter d'y coller des données confidentielles de l'entreprise","Y coller le maximum d'informations internes pour obtenir de meilleures réponses","Partager publiquement les réponses obtenues avec l'ensemble de ses contacts externes","Désactiver toutes les protections de son poste avant de formuler la demande"], en:["Avoid pasting the company's confidential data into it","Paste as much internal information as possible to get better answers","Publicly share the answers obtained with all of your external contacts","Disable all of your device's protections before making the request"]}, correct:0, why:{fr:"Sur une IA grand public non gérée par l'entreprise, on évite d'exposer des données confidentielles ; les offres Copilot professionnelles appliquent, elles, la protection des données d'entreprise.", en:"On a consumer AI not managed by the company, avoid exposing confidential data; the professional Copilot offers, by contrast, apply enterprise data protection."}},
{cat:"secu", q:{fr:"À quoi servent les boutons pouce en haut / pouce en bas sur une réponse de Copilot ?", en:"What are the thumbs-up / thumbs-down buttons on a Copilot answer for?"}, opts:{fr:["À donner un retour qui aide à améliorer le service","À supprimer définitivement la conversation et l'ensemble de son historique associé","À facturer la réponse à l'utilisateur selon qu'elle est jugée bonne ou mauvaise","À partager automatiquement la réponse sur les réseaux sociaux de l'utilisateur"], en:["To give feedback that helps improve the service","To permanently delete the conversation and all of its associated history","To bill the answer to the user depending on whether it's deemed good or bad","To automatically share the answer on the user's social networks"]}, correct:0, why:{fr:"Le feedback (pouce haut/bas) permet de signaler les réponses utiles ou à améliorer ; il contribue à l'amélioration du service, sans rien facturer ni publier.", en:"Feedback (thumbs up/down) flags helpful answers or ones to improve; it contributes to improving the service, without billing or publishing anything."}},
{cat:"secu", q:{fr:"Comment améliorer la pertinence d'une réponse sur un sujet précis qui vous est propre ?", en:"How can you improve the relevance of an answer on a topic specific to you?"}, opts:{fr:["Fournir à Copilot le fichier ou le contexte de référence","Ne donner aucune information et espérer que le modèle devine parfaitement le besoin","Multiplier les demandes identiques jusqu'à ce qu'une réponse différente apparaisse","Écrire la demande tout en majuscules pour forcer une meilleure qualité de réponse"], en:["Give Copilot the reference file or context","Provide no information and hope the model perfectly guesses the need","Repeat identical requests until a different answer eventually appears","Write the request all in capital letters to force a better answer quality"]}, correct:0, why:{fr:"Ancrer la demande sur un fichier, un lien ou un contexte fourni (ou, en Premium, sur vos données de travail) rend la réponse bien plus précise que sur des connaissances générales.", en:"Grounding the request on a provided file, link or context (or, in Premium, on your work data) makes the answer far more precise than relying on general knowledge."}},
{cat:"secu", q:{fr:"Quelle affirmation sur Copilot est correcte ?", en:"Which statement about Copilot is correct?"}, opts:{fr:["Il peut se tromper : ses réponses se relisent","Il fournit des réponses toujours exactes qu'il est parfaitement inutile de relire","Il remplace entièrement l'expertise humaine dans tous les domaines sans exception","Il garantit contractuellement l'exactitude juridique de chacune de ses réponses"], en:["It can be wrong: its answers should be reread","It provides answers that are always accurate and perfectly pointless to reread","It fully replaces human expertise in every field without any exception","It contractually guarantees the legal accuracy of each of its answers"]}, correct:0, why:{fr:"Copilot est une aide puissante mais faillible : on garde un regard critique, on relit et on valide, surtout pour les décisions importantes.", en:"Copilot is a powerful but fallible aid: keep a critical eye, reread and validate, especially for important decisions."}},
{cat:"secu", q:{fr:"Vous utilisez souvent la même consigne efficace. Quelle bonne pratique adopter ?", en:"You often use the same effective prompt. What good practice should you adopt?"}, opts:{fr:["La sauvegarder pour la réutiliser (prompt enregistré)","La réécrire intégralement de mémoire à chaque fois, au risque de l'oublier","La garder secrète pour empêcher toute réutilisation par les autres membres de l'équipe","La transformer obligatoirement en macro de code avant de pouvoir la relancer"], en:["Save it to reuse it (a saved prompt)","Rewrite it entirely from memory each time, at the risk of forgetting it","Keep it secret to prevent any reuse by the other members of the team","Turn it mandatorily into a code macro before being able to run it again"]}, correct:0, why:{fr:"Réutiliser et partager de bons prompts (via les prompts enregistrés ou une bibliothèque d'équipe) fait gagner du temps et diffuse les bonnes pratiques d'usage.", en:"Reusing and sharing good prompts (via saved prompts or a team library) saves time and spreads good usage practices."}},
{cat:"secu", q:{fr:"Que capture le journal d'audit unifié de Purview concernant les interactions Copilot ?", en:"What does Purview's unified audit log capture regarding Copilot interactions?"}, opts:{fr:["Comment et quand les utilisateurs interagissent, avec les fichiers référencés","Absolument rien : les prompts et les réponses ne sont jamais journalisés d'aucune manière","Uniquement l'heure exacte de connexion, sans le moindre détail concernant l'activité menée ensuite","L'ensemble des mots de passe saisis et utilisés par l'utilisateur au cours de sa session de travail"], en:["How and when users interact, with the referenced files","Absolutely nothing: prompts and responses are never logged in any way","Only the exact connection time, with no detail about the activity carried out afterward","All of the passwords entered and used by the user during their work session"]}, correct:0, why:{fr:"Le journal d'audit unifié capture comment et quand les utilisateurs interagissent avec l'application IA, y compris dans quel service Microsoft 365 l'activité a eu lieu et les références aux fichiers consultés.", en:"The unified audit log captures how and when users interact with the AI app, including in which Microsoft 365 service the activity took place and references to the files viewed."}},
{cat:"secu", q:{fr:"Pour bien démarrer avec Copilot au quotidien, quelle approche est recommandée ?", en:"To get started well with Copilot day to day, which approach is recommended?"}, opts:{fr:["Commencer par des tâches simples et fréquentes","Automatiser d'emblée les processus les plus critiques sans aucune phase de test","Attendre de tout maîtriser parfaitement avant d'oser la moindre première utilisation","N'utiliser Copilot que pour des tâches exceptionnelles une fois par trimestre"], en:["Start with simple, frequent tasks","Automate the most critical processes right away with no testing phase at all","Wait until you fully master everything before daring the slightest first use","Use Copilot only for exceptional tasks once per quarter"]}, correct:0, why:{fr:"On progresse en intégrant Copilot à des tâches simples et récurrentes (résumer, rédiger, reformuler), avant d'aller vers des usages plus avancés et agentiques.", en:"You progress by bringing Copilot into simple, recurring tasks (summarizing, drafting, rephrasing), before moving toward more advanced, agentic uses."}},
{cat:"secu", q:{fr:"Que permet la fonctionnalité de filigrane (watermark) pour le contenu généré par IA dans Microsoft 365 ?", en:"What does the watermark feature for AI-generated content in Microsoft 365 enable?"}, opts:{fr:["Ajouter une marque visuelle ou audio sur les contenus générés par IA","Signer électroniquement chacun des documents à l'aide d'une clé privée propre à l'utilisateur","Bloquer totalement et par défaut toute forme de génération de contenu par l'intelligence artificielle","Remplacer systématiquement l'ensemble des métadonnées EXIF associées aux images produites ou modifiées"], en:["Adding a visual or audio mark on AI-generated content","Electronically signing each document using a private key specific to the user","Fully blocking by default any form of content generation by artificial intelligence","Systematically replacing all the EXIF metadata associated with produced or modified images"]}, correct:0, why:{fr:"Une politique permet de contrôler la capacité de l'organisation à ajouter un filigrane visuel ou audio sur les contenus vidéo et audio générés ou modifiés par l'IA dans Microsoft 365, pour plus de transparence.", en:"A policy lets you control the organization's ability to add a visual or audio watermark on video and audio content generated or modified by AI in Microsoft 365, for greater transparency."}},

function buildQuestions(lang){
  return QUESTIONS_ALL.map(function(m){
    var o = {cat:m.cat, q:m.q[lang], why:m.why[lang]};
    if("correct" in m) o.correct=m.correct;
    if(m.type) o.type=m.type;
    if(m.opts) o.opts=m.opts[lang];
    if(m.image) o.image=m.image;
    if(m.hotspot) o.hotspot=m.hotspot;
    return o;
  });
}

function shuffle(arr){

  for(let i=a.length-1;i>0;i--){

const THEME_MAX_POINTS = 2000; // 20 questions x jusqu'à 100 pts
function getBadgeTier(score, cap){
  cap = cap || THEME_MAX_POINTS;
  const step = cap / BADGE_TIERS.length;
  let idx = Math.floor((score||0) / step);
  if(idx < 0) idx = 0;
  if(idx >= BADGE_TIERS.length) idx = BADGE_TIERS.length - 1;
  return Object.assign({level: idx+1}, BADGE_TIERS[idx]);
}

function scallopPath(cx, cy, outerR, innerR, lobes){
  let pts = [];
  for(let i=0;i<lobes*2;i++){
    const ang = (Math.PI*2*i)/(lobes*2) - Math.PI/2;
    const r = i%2===0 ? outerR : innerR;
    pts.push(`${(cx+r*Math.cos(ang)).toFixed(1)},${(cy+r*Math.sin(ang)).toFixed(1)}`);
  }
  return "M" + pts.join(" L") + " Z";
}

function tickMarksSVG(cx, cy, r, n, color){
  let out = "";
  for(let i=0;i<n;i++){
    const ang = (Math.PI*2*i)/n;
    const x1 = cx + (r-2)*Math.cos(ang), y1 = cy + (r-2)*Math.sin(ang);
    const x2 = cx + (r+3)*Math.cos(ang), y2 = cy + (r+3)*Math.sin(ang);
    out += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="1.4"/>`;
  }
  return out;
}

function laurelSideSVG(cx, cy, side, color, n){
  n = n || 4;
  let out = "";
  for(let i=0;i<n;i++){
    const t = i/(n-1);
    const bx = cx + side*(10 + t*16);
    const by = cy + 40 + t*10;
    out += `<ellipse cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" rx="5" ry="2.6" fill="${color}" transform="rotate(${(side*(30+t*40)).toFixed(0)} ${bx.toFixed(1)} ${by.toFixed(1)})"/>`;
  }
  return out;
}

function sparklesSVG(cx, cy, R, color){
  const pts = [[-1.05,-1.05],[1.1,-1.15],[1.15,0.85],[-1.15,0.75]];
  return pts.map(([dx,dy])=>`<circle cx="${(cx+dx*R).toFixed(1)}" cy="${(cy+dy*R).toFixed(1)}" r="2" fill="${color}"/>`).join("");
}

function polygonPath(cx, cy, R, sides, rotDeg){
  const rot = (rotDeg||0) * Math.PI/180;
  let p = [];
  for(let i=0;i<sides;i++){
    const a = rot + i*2*Math.PI/sides;
    p.push(`${(cx+R*Math.cos(a)).toFixed(1)},${(cy+R*Math.sin(a)).toFixed(1)}`);
  }
  return "M" + p.join(" L") + " Z";
}
function starPath2(cx, cy, outerR, innerR, points, rotDeg){
  const rot = (rotDeg||0) * Math.PI/180;
  let p = [];
  for(let i=0;i<points*2;i++){
    const r = i%2===0 ? outerR : innerR;
    const a = rot + i*Math.PI/points;
    p.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);
  }
  return "M" + p.join(" L") + " Z";
}
function badgeFramePath(level, cx, cy, R){
  switch(level){
    case 1: return null; // cercle géré à part
    case 2: return polygonPath(cx, cy, R, 6, -90);           // hexagone
    case 3: return scallopPath(cx, cy, R, R-7, 8);           // fleur 8
    case 4: return scallopPath(cx, cy, R, R-7, 12);          // fleur 12
    case 5: return starPath2(cx, cy, R, R-7, 12, -90);       // engrenage/pointes
    case 6: return starPath2(cx, cy, R, R*0.52, 6, -90);     // étoile 6
    case 7: return starPath2(cx, cy, R, R*0.55, 8, -90);     // étoile 8
    case 8: return starPath2(cx, cy, R, R*0.6, 12, -90);     // soleil 12
    default: return null;
  }
}

function badgeSVG(tier, size){
  size = size || 96;
  const level = tier.level;
  const gid = "badgeGrad" + level;
  const cid = "badgeClip" + level;
  const n = tier.ring.length;
  const stops = tier.ring.map((c,i)=>`<stop offset="${n>1?Math.round(i/(n-1)*100):0}%" stop-color="${c}"/>`).join("");
  const c0 = tier.ring[0], c1 = tier.ring[tier.ring.length-1];

  const cx = 50, cy = 50, R = 43;
  const big = size >= 44;

  // Silhouette distincte par grade
  const framePath = badgeFramePath(level, cx, cy, R);
  const frame = framePath
    ? `<path d="${framePath}" fill="url(#${gid})"/>`
    : `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#${gid})"/>`;

  // Couronne pour le grade suprême
  const crown = level === 8
    ? `<path d="M${cx-16},${cy-30} l3,-13 6,8 7,-13 7,13 6,-8 3,13 z" fill="url(#${gid})" stroke="#8C2E1B" stroke-width="0.6" stroke-linejoin="round"/>
       <circle cx="${cx-16}" cy="${cy-43}" r="2.2" fill="${c0}"/><circle cx="${cx}" cy="${cy-47}" r="2.4" fill="${c1}"/><circle cx="${cx+16}" cy="${cy-43}" r="2.2" fill="${c0}"/>`
    : "";

  // Fioritures réservées aux grandes tailles (classement = médaillon net)
  const laurel = (big && level >= 7)
    ? laurelSideSVG(cx, cy, -1, c0) + laurelSideSVG(cx, cy, 1, c1) : "";
  const sparkle = (big && level === 8) ? sparklesSVG(cx, cy, R+8, "#FFE9A8") : "";

  // Anneau intérieur coloré + disque sombre pour faire ressortir le perroquet
  const innerR = 31;

  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="${tierName(tier)}">
    <defs>
      <linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%">${stops}</linearGradient>
      <clipPath id="${cid}"><circle cx="${cx}" cy="${cy-3}" r="26"/></clipPath>
    </defs>
    ${sparkle}
    ${laurel}
    ${crown}
    ${frame}
    <circle cx="${cx}" cy="${cy}" r="${innerR+3}" fill="#0E2018" opacity="0.35"/>
    <circle cx="${cx}" cy="${cy}" r="${innerR}" fill="#12241A"/>
    <g clip-path="url(#${cid})">
      <image href="${BADGE_FACES[level-1] || LOGO_BADGE_FACE}" x="${cx-26}" y="${cy-29}" width="52" height="52" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <circle cx="${cx}" cy="${cy-3}" r="26" fill="none" stroke="url(#${gid})" stroke-width="2.5"/>
    <g transform="translate(${cx},${cy+38})">
      <circle r="11" fill="#12241A" stroke="url(#${gid})" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#F3F6F8">${level}</text>
    </g>
  </svg>`;
}

}

async function generateShareCard(tier, score){
  const W = 1200, H = 630;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  try{ await document.fonts.ready; }catch(e){}

  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0, "#12241A");
  bg.addColorStop(1, "#1E3327");
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  const cx = 250, cy = H/2;
  const ring = ctx.createLinearGradient(cx-150, cy-150, cx+150, cy+150);
  const stops = tier.ring;
  stops.forEach((c,i)=> ring.addColorStop(stops.length>1 ? i/(stops.length-1) : 0, c));
  ctx.beginPath(); ctx.arc(cx,cy,150,0,Math.PI*2); ctx.fillStyle = ring; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,124,0,Math.PI*2); ctx.fillStyle = "#12241A"; ctx.fill();

  try{
    const parrot = await loadImageAsync(LOGO_BADGE_FACE);
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,108,0,Math.PI*2); ctx.clip();
    const scale = Math.max(230/parrot.width, 270/parrot.height);
    const iw = parrot.width*scale, ih = parrot.height*scale;
    ctx.drawImage(parrot, cx-iw/2, cy-ih/2+8, iw, ih);
    ctx.restore();
  }catch(e){}

  ctx.fillStyle = "#F3F6F8";
  ctx.font = "700 66px 'Plus Jakarta Sans', sans-serif";
  ctx.fillText(score + " pts", 460, 290);

  ctx.fillStyle = "#E97132";
  ctx.font = "600 30px 'Plus Jakarta Sans', sans-serif";
  ctx.fillText(tier.name, 460, 340);

  ctx.fillStyle = "#BBCCBB";
  ctx.font = "500 24px 'Inter', sans-serif";
  ctx.fillText("Le grand Quiz Copilot", 460, 395);

  ctx.fillStyle = "#82A182";
  ctx.font = "400 18px 'JetBrains Mono', monospace";
  ctx.fillText("cocopilot.blog", 460, 430);

  return canvas.toDataURL("image/png");
}

  else if(state.view==="quiz") app.innerHTML = renderQuiz();
  else if(state.view==="results") app.innerHTML = renderResults();
  else if(state.view==="leaderboard") app.innerHTML = renderLeaderboardView();
  attachHandlers();
  if(state.view==="quiz" && !state.answered) startTimer();
  if(state.view==="results") initShareCard();
  if(state.view==="home"){
    ensureLeaderboard("global");
    CATS.forEach(c => ensureLeaderboard(c.id));
  }
  if(state.view==="leaderboard"){ ensureLeaderboard(state.lbTab); ensureMyRank(state.lbTab); }
  reportHeight();
}

function reportHeight(){

    const h = app.scrollHeight + 40;

  });
}

function renderLeaderboardBox(key, limit){
  const list = state.lbCache[key] || [];
  const loading = !!state.lbLoading[key];
  let body = "";
  if(loading){
    body = `<div class="lb-empty">${t('lbLoading')}</div>`;
  } else if(!list.length){
    body = `<div class="lb-empty">${t('lbEmptyFirst')}</div>`;
  } else {
    const rows = list.slice(0, limit);
    body = rows.map((e,i)=>{
      const you = state.user && e.name === state.user.name;
      const badge = badgeSVG(getBadgeTier(e.score, key === "global" ? generalCap() : THEME_MAX_POINTS), 28);
      return `<div class="lb-row ${you?"you":""}">
        <span class="lb-rank">#${i+1}</span>
        ${badge}
        <span class="lb-name">${escapeHtml(e.name)}${you?" "+t('you'):""}</span>
        <span class="lb-score">${e.score} pts</span>
      </div>`;
    }).join("");
  }
  return `
    <div class="lb-box">
      <div class="lb-title"><span>${lbLabel(key)}</span><button class="lb-refresh" data-lbkey="${key}">${t('refresh')}</button></div>
      ${body}
    </div>
  `;
}

function renderLeaderboardView(){
  const key = state.lbTab;
  const list = state.lbCache[key] || [];
  const loading = !!state.lbLoading[key];
  const cap = key === "global" ? generalCap() : THEME_MAX_POINTS;
  const myScore = state.user ? myScoreForKey(key) : 0;
  // Ma propre entrée : match nom + score (évite les homonymes)
  let myIndex = -1;
  if(state.user && myScore > 0){
    myIndex = list.findIndex(e => e.name === state.user.name && e.score === myScore);
  }
  let body = "";
  if(loading){
    body = `<div class="lb-empty">${t('lbLoading')}</div>`;
  } else if(!list.length){
    body = `<div class="lb-empty">${t('lbEmpty')}</div>`;
  } else {
    const q = (state.lbSearch || "").trim().toLowerCase();
    const indexed = list.map((e,i)=>({ e, rank:i+1 }));
    const shown = q ? indexed.filter(o => o.e.name.toLowerCase().indexOf(q) !== -1) : indexed;
    if(q && !shown.length){
      body = `<div class="lb-scroll"><div class="lb-empty">${t('noMatch')}</div></div>`;
    } else {
      const rowsHtml = shown.map(o=>{
        const e = o.e, i = o.rank - 1;
        const you = (i === myIndex);
        const badge = badgeSVG(getBadgeTier(e.score, cap), 28);
        return `<div class="lb-row ${you?"you":""}" ${you?'id="lb-you"':''}>
          <span class="lb-rank">#${o.rank}</span>
          ${badge}
          <span class="lb-name">${escapeHtml(e.name)}${you?" "+t('you'):""}</span>
          <span class="lb-score">${e.score} pts</span>
        </div>`;
      }).join("");
      body = `<div class="lb-scroll">${rowsHtml}</div>`;
    }
  }
  // Position épinglée si le joueur n'apparaît pas dans la liste chargée
  let pin = "";
  if(state.user && myScore > 0 && myIndex < 0 && list.length){
    const better = list.filter(e => e.score > myScore).length;
    const minLoaded = list[list.length-1].score;
    const exact = state.myRank && state.myRank[key];
    const rankLabel = (exact != null)
      ? ("#"+exact)
      : ((list.length >= 100 && myScore < minLoaded) ? (">"+list.length) : ("#"+(better+1)));
    const badge = badgeSVG(getBadgeTier(myScore, cap), 28);
    pin = `<div class="lb-pin"><div class="lb-row you">
      <span class="lb-rank">${rankLabel}</span>
      ${badge}
      <span class="lb-name">${escapeHtml(state.user.name)} ${t('you')}</span>
      <span class="lb-score">${myScore} pts</span>
    </div></div>`;
  }
  const qStr = (state.lbSearch || "").trim();
  const hasMore = !!(state.lbHasMore && state.lbHasMore[key]);
  const search = list.length ? `<input class="lb-search" id="lb-search" type="text" placeholder="${t('searchPlaceholder')}" aria-label="${t('searchPlaceholder')}" value="${escapeHtml(qStr)}"/>` : "";
  const count = list.length ? `<div class="lb-count">${list.length}${hasMore?"+":""} ${t('players')}</div>` : "";
  const loadingMore = !!(state.lbLoadingMore && state.lbLoadingMore[key]);
  const more = (hasMore && !qStr) ? `<button class="lb-loadmore" id="lb-loadmore" ${loadingMore?"disabled":""}>${loadingMore?t('lbLoading'):t('loadMore')}</button>` : "";
  const tabs = ["global"].concat(CATS.map(c=>c.id)).map(k=>{
    const active = k===key ? " lb-tab-active" : "";
    return `<button class="lb-tab${active}" data-lbtab="${k}" title="${lbLabel(k)}">${lbTabLabel(k)}</button>`;
  }).join("");
  return `
    <div class="top-bar">
      <button class="back-link" id="back-home">&larr; ${t('home')}</button>
      <span class="eyebrow" style="margin:0;">${t('leaderboards')}</span>
      <span></span>
    </div>
    <div class="lb-tabs">${tabs}</div>
    ${search}
    ${count}
    ${body}
    ${more}
    ${pin}
  `;
}

function miniRingSVG(pct, color, size){
  size = size || 38;
  const r = size/2 - 4;
  const cx = size/2, cy = size/2;
  const circ = 2*Math.PI*r;
  const off = circ * (1 - pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${cx} ${cy})"/>
  </svg>`;
}

function renderCatTrail(activeCatId){
  const c = catInfo(activeCatId);
  const total = state.order.length || 1;
  const pct = Math.min(100, (state.idx/total)*100);
  const inner = c.icon
    ? `<img src="${c.icon}" alt="" class="trail-icon" />`
    : `<span class="trail-dot" style="background:${c.color}"></span>`;
  return `<div class="cat-trail cat-trail-single">
    <div class="trail-item trail-active" title="${catName(c)}">
      <div class="trail-ring">${miniRingSVG(pct, c.color, 38)}${inner}</div>
    </div>
    <div class="trail-progress-text">${catName(c)} · ${t('questionWord')} ${state.idx+1}/${total}</div>
  </div>`;
}

function renderClickZone(q){
  let marks = "";
  if(state.answered){
    const hs = q.hotspot;
    marks += `<div class="click-hotspot-correct" style="left:${hs.x}%;top:${hs.y}%;width:${hs.w}%;height:${hs.h}%;"></div>`;
    if(state.selected && typeof state.selected === "object" && !state.selected.hit){
      marks += `<div class="click-mark-wrong" style="left:${state.selected.x}%;top:${state.selected.y}%;">&#10005;</div>`;
    }
  }
  return `<div class="click-zone" id="click-zone" role="button" tabindex="${state.answered ? -1 : 0}" aria-label="${escapeHtml(q.q)} ${t('clickKbdHint')}">
    <img src="${q.image}" alt="${t('screenshotAlt')}" class="click-image" draggable="false" />
    ${marks}
  </div>`;
}

function renderQuiz(){
  const total = state.order.length;
  const qIndex = state.order[state.idx];
  const q = QUESTIONS[qIndex];
  const c = catInfo(q.cat);
  const letters = ["A","B","C","D"];
  const orderMap = state.optionOrder[qIndex];
  const isClick = q.type === "click";

  let opts = "";
  if(!isClick){
    opts = orderMap.map((origIdx, displayIdx)=>{
      let cls = "opt-btn";
      if(state.answered){
        if(origIdx===q.correct) cls += " correct";
        else if(origIdx===state.selected) cls += " wrong wrong-shake";
      }
      return `<button class="${cls}" data-i="${origIdx}" aria-keyshortcuts="${letters[displayIdx]} ${displayIdx+1}" ${state.answered?"disabled":""}>
        <span class="opt-key">${letters[displayIdx]}</span><span>${q.opts[origIdx]}</span>
      </button>`;
    }).join("");
  }

  let feedback = "";
  if(state.answered){
    const ok = isClick ? (state.selected && typeof state.selected==="object" && state.selected.hit) : (state.selected===q.correct);
    const timedOut = state.selected===-1;
    const ptsLabel = timedOut ? t('timeUp') : (ok? `+${state.lastPoints} pts` : t('zeroPt'));
    const speedNote = (!timedOut) ? t('answeredIn')(state.lastElapsed.toFixed(1)) : "";
    feedback = `<div class="feedback ${ok?"ok":"ko"}" role="status" aria-live="assertive">
      <div class="feedback-title"><span>${timedOut?t('timeUp'):(ok?t('correct'):t('notQuite'))}</span><span class="feedback-points">${ptsLabel}${speedNote}</span></div>
      ${q.why}
    </div>
    <button class="next-btn" id="next-btn">${state.idx+1<total?t('nextQuestion'):t('seeResults')}</button>`;
  }

  const circ = 2*Math.PI*24;

  return `
    <div class="top-bar">
      <button class="back-link" id="back-home">&larr; ${t('home')}</button>
      <span class="q-points-live">${state.sessionPoints} pts</span>
      <span class="q-count" aria-label="Question ${state.idx+1} sur ${total}">Q${state.idx+1}/${total}</span>
    </div>
    <div class="q-progress" aria-hidden="true"><span style="width:${Math.round(((state.idx+1)/total)*100)}%"></span></div>
    ${renderCatTrail(q.cat)}
    <div class="panel-frame">
      <div class="circ-timer" role="timer" aria-label="Temps restant pour cette question">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" fill="none" stroke="var(--line)" stroke-width="4"/>
          <circle id="timer-ring" cx="28" cy="28" r="24" fill="none" stroke="var(--good)" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="0"
            transform="rotate(-90 28 28)"/>
        </svg>
        <img src="${LOGO_BADGE_FACE}" alt="" class="circ-timer-face" />
        <span class="circ-timer-num mono" id="timer-num">${MAX_TIME}</span>
      </div>
      <div class="q-meta">
        <span class="q-tag" style="color:${c.color}">${c.icon ? `<img src="${c.icon}" alt="" style="width:14px;height:14px;object-fit:contain;" />` : ""}${catName(c)}</span>
      </div>
      <div class="q-text" id="q-text" tabindex="-1">${q.q}</div>
      ${isClick ? renderClickZone(q) : `<div class="opt-list">${opts}</div>`}
      ${feedback}
    </div>
  `;
}

function renderReviewBox(){
  const rev = (state.review || []);
  const missed = rev.filter(r => !r.ok);
  if(missed.length===0){
    return `<div class="review-box review-perfect">${t('reviewPerfect')}</div>`;
  }
  const items = missed.map(r => {
    const q = QUESTIONS[r.qi];
    const isClick = q.type==="click";
    const answerLine = (!isClick && typeof q.correct==="number")
      ? `<div class="review-answer"><span class="review-answer-label">${t('correctAnswerLabel')}</span> ${escapeHtml(q.opts[q.correct])}</div>`
      : "";
    return `<div class="review-item">
      <div class="review-q">${escapeHtml(q.q)}</div>
      ${answerLine}
      <div class="review-why">${escapeHtml(q.why)}</div>
    </div>`;
  }).join("");
  return `<div class="review-box">
    <div class="review-head">${t('reviewTitle')(missed.length)}</div>
    ${items}
  </div>`;
}
